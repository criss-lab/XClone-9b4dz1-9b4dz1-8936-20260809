name: Testagram Supabase Production Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_REF: zcjtvykwwplnzyyslnop
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate migration credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN. Create a Supabase Personal Access Token and add it as a GitHub Actions secret.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD. Add the target production database password as a GitHub Actions secret.'; exit 1; }

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Link target production project
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending production migrations
        run: |
          set -euo pipefail
          supabase db push --dry-run

      - name: Apply pending production migrations
        run: |
          set -euo pipefail
          supabase db push

      - name: Verify migration history
        run: |
          set -euo pipefail
          supabase migration list --linked
          echo 'Production migration gate completed.'
