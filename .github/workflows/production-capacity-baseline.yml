name: Production Capacity Baseline

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production Deployment Reconciliation"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-capacity-baseline
  cancel-in-progress: false

jobs:
  baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PUBLIC_PRODUCTION_ORIGIN: "https://testagram.site"
      BASELINE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      LOAD_REQUESTS: "2000"
      LOAD_CONCURRENCY: "100"
      DEPLOY_WAIT_SECONDS: "300"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Skip superseded reconciliation runs
        id: guard
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).sha))')"
          if [[ "$latest" != "$EXPECTED_SHA" ]]; then
            echo "::notice::Skipping superseded production baseline. reconciliation_sha=$EXPECTED_SHA current_main=$latest"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          echo "This reconciliation is still current: $EXPECTED_SHA"

      - name: Checkout exact baseline revision
        if: steps.guard.outputs.superseded != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify checked-out revision
        if: steps.guard.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="$BASELINE_SHA"
          test "$actual" = "$expected"
          echo "Verified source SHA: $actual"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Wait for exact production revision
        if: steps.guard.outputs.superseded != 'true'
        run: node scripts/production-capacity-baseline.mjs --wait-for-deployment

      - name: Run production capacity baseline
        if: steps.guard.outputs.superseded != 'true'
        run: node scripts/production-capacity-baseline.mjs
