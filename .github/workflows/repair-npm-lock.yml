name: Repair npm lockfile
on:
  push:
    branches:
      - economical-backend-50k
permissions:
  contents: write
jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reconcile package-lock with package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reconciled lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): reconcile npm lockfile"
          git push
