name: Forensic TypeScript Repair 2
on:
  push:
    branches: [main]
    paths:
      - '.github/.forensic-typecheck-repair-2-trigger'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore affected files and apply safe fixes
        shell: bash
        run: |
          set -euo pipefail
          git checkout 7ed3ab0e8d8619d275a5f3367bb92fadce525c9d -- \
            src/pages/RegulatorPanel.tsx \
            src/pages/SeriesPage.tsx \
            src/pages/SpaceRecordingViewerPage.tsx \
            src/pages/SpacesPage.tsx \
            src/services/recommendations.ts \
            src/components/layout/TopBar.tsx \
            src/pages/RevenueAnalytics.tsx \
            src/pages/SEOAuditPage.tsx \
            src/pages/SettingsPage.tsx \
            src/pages/ThreadDetailPage.tsx \
            src/pages/ThreadsPage.tsx \
            src/pages/WalletPage.tsx
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'src/pages/RegulatorPanel.tsx',
            'src/pages/SeriesPage.tsx',
            'src/pages/SpaceRecordingViewerPage.tsx',
            'src/pages/SpacesPage.tsx',
            'src/services/recommendations.ts',
          ];
          for (const path of files) {
            let s = fs.readFileSync(path, 'utf8');
            // PostgREST builders are thenable, not Promise instances. Converting the
            // direct builder .catch() into .then().catch() preserves the old swallow semantics.
            s = s.replace(/\.catch\(\(\) => \{\}\)/g, '.then(() => {}).catch(() => {})');
            fs.writeFileSync(path, s);
          }
          {
            const path = 'src/components/layout/TopBar.tsx';
            let s = fs.readFileSync(path, 'utf8');
            s = s.replace('  showBack?: boolean;\n  showSettings?: boolean;', '  showBack?: boolean;\n  onBack?: () => void;\n  showSettings?: boolean;');
            s = s.replace('export function TopBar({ title, showProfile = true, showBack = false, showSettings = false }: TopBarProps)', 'export function TopBar({ title, showProfile = true, showBack = false, onBack, showSettings = false }: TopBarProps)');
            s = s.replace('<button onClick={() => navigate(-1)}', '<button onClick={() => (onBack ? onBack() : navigate(-1))}');
            fs.writeFileSync(path, s);
          }
          {
            const path = 'src/pages/RevenueAnalytics.tsx';
            let s = fs.readFileSync(path, 'utf8');
            s = s.replace("      let dateFilter = '';", "      let startDate: Date | null = null;");
            s = s.replace("        const startDate = new Date(now.getTime() - days * 24 * 60 * 60 * 1000);\n        dateFilter = `created_at.gte.${startDate.toISOString()}`;", "        startDate = new Date(now.getTime() - days * 24 * 60 * 60 * 1000);");
            s = s.replace("      if (dateFilter) {\n        query = query.gte('created_at', startDate.toISOString());\n      }", "      if (startDate) {\n        query = query.gte('created_at', startDate.toISOString());\n      }");
            fs.writeFileSync(path, s);
          }
          {
            const path = 'src/pages/SEOAuditPage.tsx';
            let s = fs.readFileSync(path, 'utf8');
            s = s.replace("const ROUTE_MANIFEST: Omit<RouteAudit, 'title' | 'description' | 'ogImage' | 'canonical' | 'status'>[] =", 'const ROUTE_MANIFEST: SEORoute[] =');
            s = s.replace("function scoreRoute(route: Omit<RouteAudit, 'status'>): RouteAudit['status'] {", "function scoreRoute(route: SEORoute): RouteAudit['status'] {");
            fs.writeFileSync(path, s);
          }
          {
            const path = 'src/pages/SettingsPage.tsx';
            let s = fs.readFileSync(path, 'utf8');
            s = s.replace('onClick={() => playSound(type)}', 'onClick={() => playSound(type as Parameters<typeof playSound>[0])}');
            fs.writeFileSync(path, s);
          }
          {
            const path = 'src/pages/ThreadDetailPage.tsx';
            let s = fs.readFileSync(path, 'utf8');
            s = s.replace("      await supabase\n        .from('threads')\n        .update({ views_count: supabase.raw('views_count + 1') })\n        .eq('id', id);", "      const { data: currentThread } = await supabase\n        .from('threads')\n        .select('views_count')\n        .eq('id', id)\n        .maybeSingle();\n      await supabase\n        .from('threads')\n        .update({ views_count: Number(currentThread?.views_count ?? 0) + 1 })\n        .eq('id', id);");
            fs.writeFileSync(path, s);
          }
          {
            const path = 'src/pages/ThreadsPage.tsx';
            let s = fs.readFileSync(path, 'utf8');
            const marker = '  const fetchThreads = async () => {';
            const helper = `  const normalizeThreads = (rows: any[] | null | undefined): Thread[] => (rows ?? []).map((row: any) => ({\n    ...row,\n    user_profiles: Array.isArray(row.user_profiles) ? (row.user_profiles[0] ?? { id: row.user_id, username: 'Unknown', avatar_url: null, verified: false }) : row.user_profiles,\n  }));\n\n`;
            if (!s.includes('const normalizeThreads =')) s = s.replace(marker, helper + marker);
            s = s.replace('setThreads(savedData || []);', 'setThreads(normalizeThreads(savedData));');
            s = s.replace('setThreads(data || []);', 'setThreads(normalizeThreads(data));');
            fs.writeFileSync(path, s);
          }
          {
            const path = 'src/pages/WalletPage.tsx';
            let s = fs.readFileSync(path, 'utf8');
            s = s.replace('const dailyMap: any = {};', 'const dailyMap: Record<string, { in: number; out: number }> = {};');
            s = s.replace('const map: any = {};', 'const map: Record<string, { count: number; amount: number; hasIn: boolean }> = {};');
            s = s.replace('const dayMap: any = {};', 'const dayMap: Record<string, { inAmt: number; outAmt: number; count: number }> = {};');
            s = s.replace('const top10 = Object.entries(counts).sort((a: any, b: any) => b[1] - a[1]).slice(0, 10);', 'const top10 = Object.entries(counts as Record<string, number>).sort((a, b) => b[1] - a[1]).slice(0, 10);');
            s = s.replace('uid, count,\n        username:', 'uid, count: Number(count),\n        username:');
            fs.writeFileSync(path, s);
          }
          NODE
          git diff --check
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: safely repair remaining TypeScript contracts'
          git push origin HEAD:main
      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/forensic-typecheck-repair-2.yml .github/.forensic-typecheck-repair-2-trigger || true
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: remove second one-shot forensic repair workflow'
            git push origin HEAD:main
          fi
