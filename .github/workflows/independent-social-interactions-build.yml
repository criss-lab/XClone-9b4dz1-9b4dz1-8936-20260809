name: Independent Social Interaction Build

on:
  push:
    branches: [main]
    paths:
      - 'src/features/**'
      - 'src/pages/PostInteractionPage.tsx'
      - 'src/pages/ThreadInteractionPage.tsx'
      - 'src/pages/ThreadDetailPage.tsx'
      - 'src/pages/ThreadsPage.tsx'
      - 'src/components/features/PostCard.tsx'
      - 'src/services/testagramCapabilityClient.ts'
      - 'src/App.tsx'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '_build.cjs'
      - '_self-heal.cjs'
      - '_preload.cjs'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
