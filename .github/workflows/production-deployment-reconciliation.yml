          NODE
          echo "YouTube OAuth/channel/stream-key relationship is valid."

          # Normalize copy/paste whitespace at the GitHub Actions boundary. GitHub
          # exposes the environment secret exactly as stored; do not let CR/LF or
          # accidental surrounding whitespace become part of the Cloudflare request.
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
