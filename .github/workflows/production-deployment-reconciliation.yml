      - name: Deploy Cloudflare Worker and Custom Domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.TESTAGRAM_CLOUDFLARE_ACCOUNT_ID }}
          NPM_CONFIG_LOGLEVEL: error
          NODE_OPTIONS: --no-deprecation
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::CLOUDFLARE_API_TOKEN is missing from the production environment."; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Cloudflare account ID is missing or invalid. Configure CLOUDFLARE_ACCOUNT_ID or TESTAGRAM_CLOUDFLARE_ACCOUNT_ID in the production environment."; exit 1; }
          echo "Preparing immutable build-time production revision metadata..."
          cat > cloudflare/deployment-meta.ts <<'META'
          export const DEPLOYED_COMMIT_SHA = '${{ steps.target.outputs.sha }}';
          META
          grep -F "${{ steps.target.outputs.sha }}" cloudflare/deployment-meta.ts >/dev/null
          echo "Build-time revision metadata locked to ${{ steps.target.outputs.sha }}."
          echo "Deploying testagram-web to Cloudflare and applying configured Custom Domains..."
          npx wrangler deploy --name testagram-web
          echo "Reasserting the production Custom Domain -> Worker attachment..."
          domain_status="$(curl -sS -o /tmp/testagram-worker-domain.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"hostname":"testagram.site","service":"testagram-web","zone_id":"${{ secrets.CLOUDFLARE_ZONE_ID }}","zone_name":"testagram.site"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          if [[ "$domain_status" != "200" ]] || ! jq -e '.success == true and .result.hostname == "testagram.site" and .result.service == "testagram-web"' /tmp/testagram-worker-domain.json >/dev/null 2>&1; then
            echo "::error::Cloudflare Custom Domain attachment did not resolve to Worker testagram-web (HTTP $domain_status)."
            cat /tmp/testagram-worker-domain.json
            exit 1
          fi
          echo "ActivityPub proxy is deployed with cache bypass; skipping privileged cache purge."
          echo "The public contract probe below is authoritative for endpoint correctness."
          echo "Verified Custom Domain testagram.site is attached to Worker testagram-web."
          echo "Cloudflare Worker deployment and Custom Domain reconciliation completed."

      - name: Verify Cloudflare production domain
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Verifying Testagram production origin at https://testagram.site"

          # Custom Domain attachment and edge DNS activation are asynchronous.
          # Do not fail the deployment while Cloudflare is still returning DNS
          # resolution errors or transient 503s during activation.
          max_attempts=36
          health_ok=false
          for attempt in $(seq 1 "$max_attempts"); do
            rm -f response-headers.txt health.txt
            dns_line="$(getent ahostsv4 testagram.site 2>&1 | head -n 1 || true)"
            if [[ -n "$dns_line" ]]; then
              echo "Attempt $attempt/$max_attempts: DNS resolved: $dns_line"
            else
              echo "Attempt $attempt/$max_attempts: DNS has not resolved yet."
            fi

            status="$(curl -sS --location --connect-timeout 10 --max-time 30               -D response-headers.txt -o health.txt -w '%{http_code}'               "https://testagram.site/api/health" || true)"

            if [[ "$status" == "200" ]]; then
              if grep -Eiq '^server:[[:space:]]*cloudflare' response-headers.txt; then
                if node - <<'NODE'
          const fs=require("node:fs");
          const body=fs.readFileSync("health.txt","utf8").trim();
          let p;
          try { p=JSON.parse(body); } catch { process.exit(1); }
          const expected = process.env.EXPECTED_COMMIT_SHA;
          if (p?.ok !== true || p?.service !== "testagram" || p?.edge !== "reachable") process.exit(1);
          if (p?.commit !== expected) {
            console.error("Exact-SHA mismatch:", JSON.stringify({ expected, actual: p?.commit }));
            process.exit(2);
          }
          console.log("Production exact-SHA liveness passed:", JSON.stringify(p));
          NODE
                then
                  health_ok=true
                  break
                fi
              else
                echo "NOTICE:HTTP 200 received but Cloudflare Server header is not yet present."
              fi
            else
              echo "Health endpoint is not ready yet (HTTP $status); waiting for Cloudflare Worker activation."
              if [[ -s health.txt ]]; then head -c 500 health.txt; echo; fi
            fi

            if (( attempt < max_attempts )); then
              sleep 10
            fi
          done

          [[ "$health_ok" == true ]] || {
            echo "::error::testagram.site did not become Cloudflare Worker-backed and healthy within the activation window."
            echo "Last DNS result:"
            getent ahostsv4 testagram.site || true
            echo "Last response headers:"
            cat response-headers.txt 2>/dev/null || true
            echo "Last response body:"
            head -c 2000 health.txt 2>/dev/null || true
            exit 1
          }

          ready_ok=false
          for attempt in $(seq 1 "$max_attempts"); do
            status="$(curl -sS --location --connect-timeout 10 --max-time 30               -o ready.txt -w '%{http_code}' "https://testagram.site/api/ready" || true)"
            if [[ "$status" == "200" ]]; then
              if node - <<'NODE'
          const fs=require("node:fs");
          const body=fs.readFileSync("ready.txt","utf8").trim();
          let p;
          try { p=JSON.parse(body); } catch { process.exit(1); }
          if (p?.ok !== true || p?.database !== "reachable") process.exit(1);
          console.log("Production database readiness passed:", JSON.stringify(p));
          NODE
              then
                ready_ok=true
                break
              fi
            fi
            echo "Readiness endpoint is not ready yet (HTTP $status); waiting for production database readiness."
            if (( attempt < max_attempts )); then sleep 10; fi
          done

          [[ "$ready_ok" == true ]] || {
            echo "::error::testagram.site/api/ready did not become database-ready within the activation window."
            head -c 2000 ready.txt 2>/dev/null || true
            exit 1
          }

          echo "Cloudflare production domain liveness/readiness passed."

      - name: Verify production API contracts
        shell: bash
        run: |
          set -euo pipefail
          APP_ORIGIN="https://testagram.site"

          # The public origin itself is a first-class production contract. A healthy
          # API is not sufficient if the browser root is accidentally routed to an
          # API/edge handler and returns a JSON 404/Not Found response.
          homepage_status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            -H 'Accept: text/html,application/xhtml+xml' \
            -o /tmp/testagram-homepage.html -w '%{http_code}' \
            "$APP_ORIGIN/")"
          [[ "$homepage_status" == "200" ]] || {
            echo "::error::Production homepage returned HTTP $homepage_status; expected 200."
            head -c 2000 /tmp/testagram-homepage.html || true
            exit 1
          }
          grep -qi '<html' /tmp/testagram-homepage.html || {
            echo "::error::Production homepage returned 200 but did not contain HTML; possible API/JSON route leakage."
            head -c 2000 /tmp/testagram-homepage.html || true
            exit 1
          }
          if grep -qE '^\\s*\\{.*"(error|message)"\\s*:' /tmp/testagram-homepage.html; then
            echo "::error::Production homepage returned an error JSON payload instead of the application shell."
            head -c 2000 /tmp/testagram-homepage.html || true
            exit 1
          fi
          echo "Production homepage contract passed (HTTP 200 HTML shell)."

          for endpoint in "/api/health" "/api/ready"; do
            status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30               -o /tmp/testagram-api-response.json -w '%{http_code}' "$APP_ORIGIN$endpoint")"
            [[ "$status" == "200" ]] || {
              echo "::error::Production endpoint $endpoint returned HTTP $status."
              cat /tmp/testagram-api-response.json || true
              exit 1
            }
          done

          # Federation production contract: fail the reconciliation if the public
          # discovery/actor endpoints are still served by a stale/competing route.
          declare -a FEDERATION_ENDPOINTS=(
            "/.well-known/nodeinfo"
            "/nodeinfo/2.0"
            "/nodeinfo/2.1"
            "/users/crissbeat"
            "/users/crissbeat/outbox"
          )
          for endpoint in "${FEDERATION_ENDPOINTS[@]}"; do
            status="$(curl --silent --show-error --max-redirs 0 --connect-timeout 10 --max-time 30               -H 'Accept: application/activity+json, application/ld+json;q=0.9, application/json;q=0.8'               -o /tmp/testagram-federation-response -w '%{http_code}'               "$APP_ORIGIN$endpoint")"
            [[ "$status" == "200" ]] || {
              echo "::error::Production ActivityPub endpoint $endpoint returned HTTP $status."
              head -c 2000 /tmp/testagram-federation-response || true
              exit 1
            }
          done
          for inbox_endpoint in "/inbox" "/users/crissbeat/inbox" "/users/crissbeat/inbox/"; do
            inbox_status="$(curl --silent --show-error --max-redirs 0 --connect-timeout 10 --max-time 30               -o /tmp/testagram-inbox-response -w '%{http_code}' "$APP_ORIGIN$inbox_endpoint")"
            [[ "$inbox_status" == "405" ]] || {
              echo "::error::Production ActivityPub inbox GET contract $inbox_endpoint returned HTTP $inbox_status; expected 405."
              head -c 2000 /tmp/testagram-inbox-response || true
              exit 1
            }
          done
          echo "Production ActivityPub discovery, actor, outbox and all public inbox route contracts passed."

          feed_status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30             -o /tmp/testagram-home-feed.json -w '%{http_code}'             "$APP_ORIGIN/api/home-feed?limit=6&includeFederated=0")"
          [[ "$feed_status" == "200" ]] || {
            echo "::error::Production home-feed API returned HTTP $feed_status."
            head -c 2000 /tmp/testagram-home-feed.json || true
            exit 1
          }

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const body = fs.readFileSync("/tmp/testagram-home-feed.json", "utf8");
          let payload;
          try { payload = JSON.parse(body); }
          catch { throw new Error("Production home-feed did not return valid JSON."); }
          if (!payload || !Array.isArray(payload.items)) {
            throw new Error("Production home-feed contract is invalid: expected an items array.");
          }
          console.log(JSON.stringify({
            ok: true,
            item_count: payload.items.length,
            has_pagination: Boolean(payload.pagination),
            api_contract: "home-feed-v1"
          }));
