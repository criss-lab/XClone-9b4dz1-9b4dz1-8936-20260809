            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/stream/live_inputs/$disposable_input" >/tmp/testagram-cloudflare-stream-delete.json
            echo "Cloudflare Stream Write permission verified and disposable preflight input removed."
          else
            if grep -q '"code"[[:space:]]*:[[:space:]]*10002' /tmp/testagram-cloudflare-stream.json && grep -qi 'stream not enabled' /tmp/testagram-cloudflare-stream.json; then
