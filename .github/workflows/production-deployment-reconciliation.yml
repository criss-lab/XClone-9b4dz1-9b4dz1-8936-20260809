          supabase secrets set --project-ref "$PROJECT_REF"             "TESTAGRAM_CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"             "TESTAGRAM_CLOUDFLARE_STREAM_API_TOKEN=$CLOUDFLARE_API_TOKEN"             "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"             "CLOUDFLARE_STREAM_API_TOKEN=$CLOUDFLARE_API_TOKEN"             "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"             "CLOUDFLARE_TURN_TOKEN_ID=$CLOUDFLARE_TURN_TOKEN_ID"             "CLOUDFLARE_TURN_API_TOKEN=$CLOUDFLARE_TURN_API_TOKEN"
          printf '::add-mask::%s\n' "$YOUTUBE_STREAM_KEY"
          supabase secrets set --project-ref "$PROJECT_REF" "YOUTUBE_CLIENT_ID=$YOUTUBE_CLIENT_ID"
          supabase secrets set --project-ref "$PROJECT_REF" "YOUTUBE_CLIENT_SECRET=$YOUTUBE_CLIENT_SECRET"
          supabase secrets set --project-ref "$PROJECT_REF" "YOUTUBE_REFRESH_TOKEN=$YOUTUBE_REFRESH_TOKEN"
          supabase secrets set --project-ref "$PROJECT_REF" "YOUTUBE_RTMP_URL=$YOUTUBE_RTMP_URL"
          supabase secrets set --project-ref "$PROJECT_REF" "YOUTUBE_STREAM_KEY=$YOUTUBE_STREAM_KEY"
          echo "YouTube output credential and secure RTMPS endpoint synchronized to the Cloudflare TV control plane."
          attempt=1; max_attempts=4
          while true; do
            echo "Deploying tv-media-control (attempt $attempt/$max_attempts)"
            if supabase functions deploy tv-media-control --use-api --project-ref "$PROJECT_REF" --no-verify-jwt; then break; fi
            if (( attempt >= max_attempts )); then echo "::error::tv-media-control deployment failed after $max_attempts attempts."; exit 1; fi
            delay=$((attempt * 20)); echo "NOTICE:tv-media-control deployment retrying in ${delay}s."; sleep "$delay"; attempt=$((attempt+1))
          done
          echo "Testagram TV Cloudflare control-plane Edge Function deployed."
      - name: Reconcile Cloudflare DNS for Worker Custom Domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::CLOUDFLARE_API_TOKEN is required for Cloudflare DNS reconciliation."; exit 1; }

          echo "Verifying the exact Cloudflare token injected into the production environment..."
          token_verify_status="$(curl -sS -o /tmp/cloudflare-token-verify.json -w "%{http_code}" --retry 4 --retry-delay 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          if [[ "$token_verify_status" != "200" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not accepted by Cloudflare (HTTP $token_verify_status)."
            cat /tmp/cloudflare-token-verify.json
            exit 1
          fi
          node - <<'NODE'
          const fs=require("node:fs");
          const p=JSON.parse(fs.readFileSync("/tmp/cloudflare-token-verify.json","utf8"));
          if(p?.success!==true || p?.result?.status!=="active"){
            console.error("::error::Cloudflare API token is not active:",JSON.stringify({success:p?.success,status:p?.result?.status,errors:p?.errors}));
            process.exit(1);
          }
          console.log("Cloudflare API token is active.");
          NODE

          zone_id="$(printf '%s' "$CLOUDFLARE_ZONE_ID" | tr -d '[:space:]')"
          if [[ -n "$zone_id" ]]; then
            [[ "$zone_id" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::CLOUDFLARE_ZONE_ID is not a valid 32-character zone ID."; exit 1; }
            echo "Using explicitly configured Cloudflare zone ID."
          else
            echo "Resolving active Cloudflare zone for testagram.site..."
            zone_response="$(curl -sS -w '\n%{http_code}' --retry 4 --retry-delay 2 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=testagram.site&status=active")"
            zone_status="${zone_response##*$'\n'}"
            zone_body="${zone_response%$'\n'*}"
            if [[ "$zone_status" != "200" ]]; then
              echo "::error::Cloudflare zone lookup failed (HTTP $zone_status)."
              echo "::error::Token verification passed, so this is a zone-listing/scope problem. Configure CLOUDFLARE_ZONE_ID and ensure Zone:DNS:Edit applies to testagram.site."
              printf '%s\n' "$zone_body"
              exit 1
            fi
            zone_id="$(printf '%s' "$zone_body" | jq -r '.result[] | select(.status == "active") | .id' | head -n 1)"
            [[ "$zone_id" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Active testagram.site zone was not resolved."; exit 1; }
          fi
          printf '::add-mask::%s\n' "$zone_id"

          for host in testagram.site www.testagram.site; do
            for type in A AAAA CNAME; do
              echo "Checking $type records for $host..."
              dns_response="$(curl -sS -w '\n%{http_code}' --retry 4 --retry-delay 2 \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Accept: application/json" \
                "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$host&type=$type&per_page=100")"
              dns_status="${dns_response##*$'\n'}"
              dns_body="${dns_response%$'\n'*}"
              if [[ "$dns_status" != "200" ]]; then
                echo "::error::Cloudflare DNS record lookup failed for $host/$type (HTTP $dns_status)."
                printf '%s\n' "$dns_body"
                exit 1
              fi
              ids="$(printf '%s' "$dns_body" | jq -r '.result[]?.id')"
              while IFS= read -r record_id; do
                [[ -n "$record_id" ]] || continue
                echo "Removing conflicting $type DNS record for $host before Custom Domain attachment."
                status="$(curl -sS -o /tmp/cloudflare-dns-delete.json -w '%{http_code}' \
                  -X DELETE \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  -H "Accept: application/json" \
                  "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id")"
                if [[ "$status" != "200" ]]; then
                  if jq -e '.errors[]? | select(.code == 1043)' /tmp/cloudflare-dns-delete.json >/dev/null 2>&1; then
                    echo "Cloudflare-managed $host/$type record $record_id is read-only (API 1043); preserving it as required for Custom Domain DNS."
                    echo "Custom Domain deployment will be allowed to reconcile Cloudflare-managed DNS instead of attempting to delete it."
                    continue
                  fi
                  echo "::error::Cloudflare DNS record deletion failed for $host/$type (HTTP $status)."
                  cat /tmp/cloudflare-dns-delete.json
                  exit 1
                fi
              done <<< "$ids"
            done
          done
          echo "Cloudflare DNS is clear for Worker Custom Domain attachment."

      - name: Remove conflicting Cloudflare routes for production Custom Domain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::CLOUDFLARE_API_TOKEN is required for route reconciliation."; exit 1; }
          [[ "$CLOUDFLARE_ZONE_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::CLOUDFLARE_ZONE_ID is missing or invalid."; exit 1; }

          routes_json="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes")"

          mapfile -t conflicting_routes < <(jq -r '
            .result[]?
            | select(
                (.pattern == "testagram.site/*" or .pattern == "testagram.site/api/*" or
                 .pattern == "www.testagram.site/*" or .pattern == "www.testagram.site/api/*")
                and (.script // "") != "testagram-web"
              )
            | [.id, .pattern, (.script // "(disabled route)")] | @tsv
          ' <<<"$routes_json")

          for route in "${conflicting_routes[@]}"; do
            [[ -n "$route" ]] || continue
            IFS=$'\t' read -r route_id pattern script <<<"$route"
            echo "Removing conflicting route $route_id ($pattern -> $script)..."
            delete_status="$(curl -sS -o /tmp/cloudflare-route-delete.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes/$route_id")"
            if [[ "$delete_status" != "200" ]] || ! jq -e '.success == true' /tmp/cloudflare-route-delete.json >/dev/null 2>&1; then
              echo "::error::Failed to remove conflicting Cloudflare route $route_id (HTTP $delete_status)."
              cat /tmp/cloudflare-route-delete.json
              exit 1
            fi
          done

          echo "Cloudflare route reconciliation passed: no legacy route overrides the Testagram Custom Domain."
          echo "Cloudflare route API: GET/DELETE /zones/{zone_id}/workers/routes."
      - name: Reconcile Resend DNS authentication for testagram.site
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_API_TOKEN is required for Resend DNS reconciliation."; exit 1; }
          [[ "${CLOUDFLARE_ZONE_ID:-}" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::CLOUDFLARE_ZONE_ID is missing or invalid."; exit 1; }

          API="https://api.cloudflare.com/client/v4"
          upsert_dns() {
            local name="$1" type="$2" content="$3" priority="${4:-}"
            local encoded_name
            encoded_name="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$name")"
            local list
            list="$(curl -fsS --retry 4 --retry-delay 2               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Accept: application/json"               "$API/zones/$CLOUDFLARE_ZONE_ID/dns_records?name=$encoded_name&type=$type&per_page=100")"
            local count
            count="$(jq '.result | length' <<<"$list")"
            local payload
            if [[ "$type" == "MX" ]]; then
              payload="$(jq -cn --arg name "$name" --arg content "$content" --argjson priority "$priority" '{name:$name,type:"MX",ttl:1,content:$content,priority:$priority}')"
            else
              payload="$(jq -cn --arg name "$name" --arg type "$type" --arg content "$content" '{name:$name,type:$type,ttl:1,content:$content}')"
            fi

            if [[ "$count" -gt 0 ]]; then
              local id
              id="$(jq -r '.result[0].id' <<<"$list")"
              curl -fsS --retry 4 --retry-delay 2 -X PUT                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                 -H "Content-Type: application/json"                 --data "$payload"                 "$API/zones/$CLOUDFLARE_ZONE_ID/dns_records/$id" | jq -e '.success == true' >/dev/null
              echo "Updated Resend DNS $type $name."
            else
              curl -fsS --retry 4 --retry-delay 2 -X POST                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                 -H "Content-Type: application/json"                 --data "$payload"                 "$API/zones/$CLOUDFLARE_ZONE_ID/dns_records" | jq -e '.success == true' >/dev/null
              echo "Created Resend DNS $type $name."
            fi
          }

          upsert_dns "resend._domainkey.testagram.site" "TXT" "p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDMNrdsGbFD2a2pgCipQ1twW1mwdgZXDFTBOY4J70nhG4Ip9jDk+TkEKpnraQV2HoJ+6qCdWIAW2uQH9sHsVxp6914bVgUNIjjF+A8TAvpLBOOBVGLo8b/LZjDDha3aokzxzITHnDhTVIcW95GUtj0MT0If8a43U1GMURSdMGiSTwIDAQAB"
          upsert_dns "send.testagram.site" "MX" "feedback-smtp.us-east-1.amazonses.com" "10"
          upsert_dns "send.testagram.site" "TXT" "v=spf1 include:amazonses.com ~all"
          upsert_dns "rsend.testagram.site" "CNAME" "send.forge.rmta.net"
          echo "Resend DNS authentication records reconciled."

      - name: Synchronize Resend runtime secret when provisioned
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_SERVICE_TOKEN: ${{ secrets.EMAIL_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RESEND_API_KEY:-}" || -z "${EMAIL_SERVICE_TOKEN:-}" ]]; then
            echo "NOTICE: Resend runtime secrets are not fully provisioned; transactional email endpoint remains disabled until both are added to the production environment."
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --name testagram-web
          printf '%s' "$EMAIL_SERVICE_TOKEN" | npx wrangler secret put EMAIL_SERVICE_TOKEN --name testagram-web
          echo "Resend runtime secrets synchronized to testagram-web without printing values."

      - name: Deploy Cloudflare Worker and Custom Domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.TESTAGRAM_CLOUDFLARE_ACCOUNT_ID }}
          NPM_CONFIG_LOGLEVEL: error
          NODE_OPTIONS: --no-deprecation
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::CLOUDFLARE_API_TOKEN is missing from the production environment."; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Cloudflare account ID is missing or invalid. Configure CLOUDFLARE_ACCOUNT_ID or TESTAGRAM_CLOUDFLARE_ACCOUNT_ID in the production environment."; exit 1; }
          echo "Preparing immutable build-time production revision metadata..."
          cat > cloudflare/deployment-meta.ts <<'META'
          export const DEPLOYED_COMMIT_SHA = '${{ steps.target.outputs.sha }}';
          META
          grep -F "${{ steps.target.outputs.sha }}" cloudflare/deployment-meta.ts >/dev/null
          echo "Build-time revision metadata locked to ${{ steps.target.outputs.sha }}."
          echo "Deploying testagram-web to Cloudflare and applying configured Custom Domains..."
          npx wrangler deploy --name testagram-web
          echo "Reasserting the production Custom Domain -> Worker attachment..."
          domain_status="$(curl -sS -o /tmp/testagram-worker-domain.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"hostname":"testagram.site","service":"testagram-web","zone_id":"${{ secrets.CLOUDFLARE_ZONE_ID }}","zone_name":"testagram.site"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          if [[ "$domain_status" != "200" ]] || ! jq -e '.success == true and .result.hostname == "testagram.site" and .result.service == "testagram-web"' /tmp/testagram-worker-domain.json >/dev/null 2>&1; then
            echo "::error::Cloudflare Custom Domain attachment did not resolve to Worker testagram-web (HTTP $domain_status)."
            cat /tmp/testagram-worker-domain.json
            exit 1
          fi
          echo "Verified Custom Domain testagram.site is attached to Worker testagram-web."
          echo "Cloudflare Worker deployment and Custom Domain reconciliation completed."

      - name: Verify Cloudflare production domain
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Verifying Testagram production origin at https://testagram.site"

          # Custom Domain attachment and edge DNS activation are asynchronous.
          # Do not fail the deployment while Cloudflare is still returning DNS
          # resolution errors or transient 503s during activation.
          max_attempts=36
          health_ok=false
          for attempt in $(seq 1 "$max_attempts"); do
            rm -f response-headers.txt health.txt
            dns_line="$(getent ahostsv4 testagram.site 2>&1 | head -n 1 || true)"
            if [[ -n "$dns_line" ]]; then
              echo "Attempt $attempt/$max_attempts: DNS resolved: $dns_line"
            else
              echo "Attempt $attempt/$max_attempts: DNS has not resolved yet."
            fi

            status="$(curl -sS --location --connect-timeout 10 --max-time 30               -D response-headers.txt -o health.txt -w '%{http_code}'               "https://testagram.site/api/health" || true)"

            if [[ "$status" == "200" ]]; then
              if grep -Eiq '^server:[[:space:]]*cloudflare' response-headers.txt; then
                if node - <<'NODE'
          const fs=require("node:fs");
          const body=fs.readFileSync("health.txt","utf8").trim();
          let p;
          try { p=JSON.parse(body); } catch { process.exit(1); }
          const expected = process.env.EXPECTED_COMMIT_SHA;
          if (p?.ok !== true || p?.service !== "testagram" || p?.edge !== "reachable") process.exit(1);
          if (p?.commit !== expected) {
            console.error("Exact-SHA mismatch:", JSON.stringify({ expected, actual: p?.commit }));
            process.exit(2);
          }
          console.log("Production exact-SHA liveness passed:", JSON.stringify(p));
          NODE
                then
                  health_ok=true
                  break
                fi
              else
                echo "NOTICE:HTTP 200 received but Cloudflare Server header is not yet present."
              fi
            else
              echo "Health endpoint is not ready yet (HTTP $status); waiting for Cloudflare Worker activation."
              if [[ -s health.txt ]]; then head -c 500 health.txt; echo; fi
            fi

            if (( attempt < max_attempts )); then
              sleep 10
            fi
          done

          [[ "$health_ok" == true ]] || {
            echo "::error::testagram.site did not become Cloudflare Worker-backed and healthy within the activation window."
            echo "Last DNS result:"
            getent ahostsv4 testagram.site || true
            echo "Last response headers:"
            cat response-headers.txt 2>/dev/null || true
            echo "Last response body:"
            head -c 2000 health.txt 2>/dev/null || true
            exit 1
          }

          ready_ok=false
          for attempt in $(seq 1 "$max_attempts"); do
            status="$(curl -sS --location --connect-timeout 10 --max-time 30               -o ready.txt -w '%{http_code}' "https://testagram.site/api/ready" || true)"
            if [[ "$status" == "200" ]]; then
              if node - <<'NODE'
          const fs=require("node:fs");
          const body=fs.readFileSync("ready.txt","utf8").trim();
          let p;
          try { p=JSON.parse(body); } catch { process.exit(1); }
          if (p?.ok !== true || p?.database !== "reachable") process.exit(1);
          console.log("Production database readiness passed:", JSON.stringify(p));
          NODE
              then
                ready_ok=true
                break
              fi
            fi
            echo "Readiness endpoint is not ready yet (HTTP $status); waiting for production database readiness."
            if (( attempt < max_attempts )); then sleep 10; fi
          done

          [[ "$ready_ok" == true ]] || {
            echo "::error::testagram.site/api/ready did not become database-ready within the activation window."
            head -c 2000 ready.txt 2>/dev/null || true
            exit 1
          }

          echo "Cloudflare production domain liveness/readiness passed."


