            console.error("::error::Owned stream diagnostics (stream keys intentionally omitted): "+JSON.stringify(items.map(x=>({id:x?.id||null,title:x?.snippet?.title||null,status:x?.status?.streamStatus||null}))));
            process.exit(2);
          }
