      - name: Pull production Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy and reconcile exact SHA
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "$MAX_DEPLOY_ATTEMPTS"); do
            echo "Deployment reconciliation attempt $attempt/$MAX_DEPLOY_ATTEMPTS"
            rm -f deployment-url.txt deployment-list.json health.txt

            # Reuse an already READY production deployment for this exact commit when
            # one exists. The Vercel Production Deploy workflow can finish just before
            # reconciliation; creating a second deployment wastes the free-tier quota
            # and previously caused the reconciliation gate (and therefore the capacity
            # baseline) to be skipped even though production was already healthy.
            existing_deploy_url="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=50" \
              | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{try{const p=JSON.parse(s);const d=(p.deployments||[]).find(x=>x.target==="production"&&x.state==="READY"&&x.meta?.githubCommitSha===process.env.TARGET_SHA);process.stdout.write(d?.url?("https://"+d.url):"")}catch{process.stdout.write("")}})' || true)"

            if [[ -n "$existing_deploy_url" ]]; then
              DEPLOY_URL="$existing_deploy_url"
              echo "Reusing existing READY production deployment for exact SHA $TARGET_SHA: $DEPLOY_URL"
            else
              # Build on Vercel with its production environment, then deploy.
              # Use Vercel's archive upload mode to avoid the Hobby api-upload-free
              # per-file upload quota while preserving the exact-SHA build metadata.
              vercel deploy --prod --yes --force --archive=tgz --token="$VERCEL_TOKEN" \
                --build-env "TESTAGRAM_COMMIT_SHA=$TARGET_SHA" \
                --env "TESTAGRAM_COMMIT_SHA=$TARGET_SHA" \
                --meta "githubDeployment=1" \
                --meta "githubCommitSha=$TARGET_SHA" \
                --meta "githubCommitRef=main" \
                --meta "githubCommitRepo=$REPO_NAME" \
                --meta "githubCommitOrg=$REPO_OWNER" \
                --meta "githubOrg=$REPO_OWNER" \
                --meta "githubRepo=$REPO_NAME" > deployment-url.txt

              # Vercel CLI emits Inspect/Production URLs plus progress/status lines.
              # Extract the canonical Production URL instead of assuming the final line is a URL.
              DEPLOY_URL="$(grep -E '^Production:[[:space:]]+https?://[^[:space:]]+' deployment-url.txt | tail -n 1 | sed -E 's/^Production:[[:space:]]+//; s/[[:space:]]+$//' || true)"
              if [[ -z "$DEPLOY_URL" ]]; then
                DEPLOY_URL="$(grep -Eo 'https?://[^[:space:]]+' deployment-url.txt | tail -n 1 | tr -d '\r' || true)"
              fi
              [[ "$DEPLOY_URL" =~ ^https?://[^[:space:]]+$ ]] || { echo "::warning::No canonical deployment URL found on attempt $attempt"; sleep 10; continue; }
              echo "Created exact-SHA deployment: $DEPLOY_URL"
            fi

            echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

            vercel inspect "$DEPLOY_URL" --wait --token="$VERCEL_TOKEN" > deployment-inspect.txt

            # Source-triggered Vercel deployments can race this explicit production deploy.
            # Pin both custom-domain aliases to the exact deployment before liveness checks.
            vercel alias set "$DEPLOY_URL" testagram.site --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
            vercel alias set "$DEPLOY_URL" www.testagram.site --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20" \
              > deployment-list.json
            node scripts/verify-vercel-deployment.mjs

            # Diagnose custom-domain DNS before probing the public alias. A READY Vercel
            # deployment can still be unreachable when the registrar/Cloudflare DNS zone
            # is not resolving. Keep DNS failure distinct from build/deployment failure.
            if command -v dig >/dev/null 2>&1; then
              echo "DNS diagnostics for testagram.site:"
              dig +short testagram.site A @1.1.1.1 || true
              echo "DNS diagnostics for www.testagram.site:"
              dig +short www.testagram.site CNAME @1.1.1.1 || true
            fi

            # Vercel CLI 54.15+ provides an authoritative DNS diagnosis. Preserve the
            # JSON even when the command exits non-zero so the exact required record(s)
            # are visible in the failed run.
            domain_verify_ok=0
            if vercel domains verify testagram.site --project "$VERCEL_PROJECT_ID" --format json --non-interactive > domain-verify.json 2>&1; then
              domain_verify_ok=1
              echo "Custom domain DNS verification passed."
            else
              echo "::warning::Custom domain DNS verification is not valid yet."
              node -e 'const fs=require("node:fs"); const raw=fs.readFileSync("domain-verify.json","utf8").trim(); try { const p=JSON.parse(raw); console.log(JSON.stringify({status:p.status,ok:p.ok,reason:p.reason,message:p.message,recommended:p.recommended,conflicts:p.conflicts,next:p.next}, null, 2)); } catch { console.log("Vercel DNS verification returned non-JSON output:"); console.log(raw); }'
            fi

            # Probe the public production alias. Do NOT create another Vercel deployment
            # when this fails: repeated deployments cannot repair external DNS and waste
            # build time/credits. The exact READY deployment above remains the artifact
            # under test, while this loop only retries the external DNS path.
            health_ok=0
            for dns_attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
                "https://testagram.site/api/health" > health.txt; then
                health_ok=1
                break
              fi
              echo "::warning::Public production health probe failed ($dns_attempt/12) for deployment $DEPLOY_URL"
              if [[ "$domain_verify_ok" -ne 1 ]]; then
                echo "Custom-domain DNS is the remaining gate; waiting 15s before rechecking without redeploying."
              else
                echo "DNS verification passed but the public health path is not responding; waiting 15s before rechecking."
              fi
              sleep 15
            done
            if [[ "$health_ok" -ne 1 ]]; then
              echo "::error::Public production health remained unreachable after 12 DNS/health checks."
              cat health.txt || true
              echo "The Vercel deployment is READY; no additional deployment was created because redeploying cannot repair external DNS."
              if [[ -f domain-verify.json ]]; then
                echo "Vercel domain verification evidence:"
                cat domain-verify.json
              fi
              exit 1
            fi
            node -e 'const fs=require("node:fs"); const body=fs.readFileSync("health.txt","utf8").trim(); let payload; try { payload=JSON.parse(body); } catch (error) { console.error("Liveness endpoint did not return valid JSON:", error instanceof Error ? error.message : error); console.error(body); process.exit(1); } const expected=process.env.TARGET_SHA; if (payload?.ok !== true || payload?.service !== "testagram" || payload?.edge !== "reachable" || payload?.commit !== expected) { console.error("Liveness contract failed:", JSON.stringify({expected_commit:expected,payload})); process.exit(1); } console.log("Liveness contract passed:", JSON.stringify(payload));'

            # /api/health is intentionally liveness-only. Database traffic stays on
            # /api/ready so the 2,000-request capacity test does not amplify DB load.
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2               "https://testagram.site/api/ready" > ready.txt || {
              echo "::warning::Public production readiness probe failed on attempt $attempt"
              cat ready.txt || true
              sleep 10
              continue
            }
            node -e 'const fs=require("node:fs"); const body=fs.readFileSync("ready.txt","utf8").trim(); let payload; try { payload=JSON.parse(body); } catch (error) { console.error("Readiness endpoint did not return valid JSON:", error instanceof Error ? error.message : error); console.error(body); process.exit(1); } if (payload?.ok !== true || payload?.database !== "reachable") { console.error("Readiness contract failed:", JSON.stringify(payload)); process.exit(1); } console.log("Readiness contract passed:", JSON.stringify(payload));'

            echo "Exact SHA, production READY state, liveness, and separate database readiness passed."
            exit 0
          done
          echo "::error::Production deployment reconciliation exhausted its 3-attempt circuit breaker."
          exit 1

      - name: Emit immutable gate evidence
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          # shellcheck disable=SC2129
          {
            echo "target_sha=$TARGET_SHA"
            echo "deployment_url=${{ steps.deploy.outputs.deployment_url }}"
            echo "gate=build-typecheck-lint-deploy-sha-liveness-readiness"
            echo "status=passed"
          } >> "$GITHUB_STEP_SUMMARY"

