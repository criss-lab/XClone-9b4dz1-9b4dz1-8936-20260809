          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -q '[[:space:]]'; then
            echo "::error::TESTAGRAM_CLOUDFLARE_STREAM_API_TOKEN contains whitespace; replace the GitHub secret with the token value only."
            exit 1
          fi

          echo "Validating the exact TV Cloudflare token GitHub injected into this production job..."
          cf_token_verify_status="$(curl -sS -o /tmp/testagram-cloudflare-token-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          if [[ "$cf_token_verify_status" != "200" ]]; then
            echo "::error::The fresh TESTAGRAM_CLOUDFLARE_STREAM_API_TOKEN is not accepted by Cloudflare (HTTP $cf_token_verify_status)."
            cat /tmp/testagram-cloudflare-token-verify.json
            exit 1
          fi
          node - <<'NODE'
          const fs=require("node:fs");
          const p=JSON.parse(fs.readFileSync("/tmp/testagram-cloudflare-token-verify.json","utf8"));
          if (p?.success !== true || p?.result?.status !== "active") {
            console.error("::error::Cloudflare TV API token is not active:", JSON.stringify({success:p?.success,status:p?.result?.status,errors:p?.errors}));
            process.exit(1);
          }
          console.log("Cloudflare TV API token is active; GitHub secret injection is verified.");
          NODE

          # Do not use /accounts/{id}/tokens/verify as the TV gate. Cloudflare's
          # account-token verification endpoint is specifically for account-owned
          # token validation and can reject an otherwise active API token before the
          # actual Stream permission endpoint is reached. The Stream API itself is the
          # authoritative check for this TV token/account pair.
          echo "Validating Cloudflare Stream access for the configured account..."
          cf_status="$(curl -sS -o /tmp/testagram-cloudflare-stream.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/stream/live_inputs?per_page=1")"
          if [[ "$cf_status" == "200" ]] && grep -q '"success"[[:space:]]*:[[:space:]]*true' /tmp/testagram-cloudflare-stream.json; then
            echo "Cloudflare Stream is provisioned and accessible."
            export TESTAGRAM_TV_CLOUDFLARE_AVAILABLE=true

            echo "Validating Cloudflare Stream Write permission with a disposable Live Input..."
            cf_write="$(curl -sS -X POST -o /tmp/testagram-cloudflare-stream-write.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: testagram-ci-preflight-$GITHUB_RUN_ID" \
              --data '{"enabled":false,"meta":{"name":"Testagram CI credential preflight"},"recording":{"mode":"off"}}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/stream/live_inputs")"
            if [[ "$cf_write" != "200" ]]; then
              echo "::error::Cloudflare Stream Write preflight failed with HTTP $cf_write."
              cat /tmp/testagram-cloudflare-stream-write.json
              exit 1
            fi
            disposable_input="$(python3 -c 'import json; print(json.load(open("/tmp/testagram-cloudflare-stream-write.json"))["result"]["uid"])')"
            if [[ -z "$disposable_input" ]]; then
