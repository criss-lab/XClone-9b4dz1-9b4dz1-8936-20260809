          const items=Array.isArray(payload.items)?payload.items:[];
          const match=items.find(x=>String(x?.cdn?.ingestionInfo?.streamName||"")===key);
          if(!match){
            console.error("::error::YouTube OAuth is valid, but YOUTUBE_STREAM_KEY does not match any live stream owned by that OAuth channel.");
