          require_secret "YOUTUBE_REFRESH_TOKEN" "$YOUTUBE_REFRESH_TOKEN"
          require_secret "YOUTUBE_RTMP_URL" "$YOUTUBE_RTMP_URL"
          require_secret "YOUTUBE_INGESTION_URL" "$YOUTUBE_INGESTION_URL"
          require_secret "YOUTUBE_BACKUP_INGESTION_URL" "$YOUTUBE_BACKUP_INGESTION_URL"
          require_secret "YOUTUBE_STREAM_KEY" "$YOUTUBE_STREAM_KEY"

          # Verify the OAuth credentials and stream key against YouTube itself before
          # publishing the credentials into Supabase. Secret presence alone cannot prove
          # that the stream key belongs to the channel represented by the refresh token.
          echo "Verifying YouTube OAuth credentials and configured stream ownership..."
          YT_ACCESS_TOKEN="$(YOUTUBE_CLIENT_ID="$YOUTUBE_CLIENT_ID" YOUTUBE_CLIENT_SECRET="$YOUTUBE_CLIENT_SECRET" YOUTUBE_REFRESH_TOKEN="$YOUTUBE_REFRESH_TOKEN" node <<NODE
          const tokenRes=await fetch("https://oauth2.googleapis.com/token",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:process.env.YOUTUBE_CLIENT_ID,client_secret:process.env.YOUTUBE_CLIENT_SECRET,refresh_token:process.env.YOUTUBE_REFRESH_TOKEN,grant_type:"refresh_token"})});
          const token=await tokenRes.json().catch(()=>({}));
          if(!tokenRes.ok||!token.access_token){console.error("::error::YouTube OAuth refresh failed:",token.error_description||token.error||"unknown error");process.exit(1);}
          process.stdout.write(token.access_token);
          NODE
          )"
          printf "::add-mask::%s\n" "$YT_ACCESS_TOKEN"
          yt_streams_json="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 -H "Authorization: Bearer $YT_ACCESS_TOKEN" "https://www.googleapis.com/youtube/v3/liveStreams?part=id,snippet,cdn,status&mine=true&maxResults=50")"
          YOUTUBE_STREAM_KEY="$YOUTUBE_STREAM_KEY" YT_STREAMS_JSON="$yt_streams_json" node <<NODE
          const key=process.env.YOUTUBE_STREAM_KEY;
