          printf '%s' "$YOUTUBE_CLIENT_SECRET" | vercel env add "YOUTUBE_CLIENT_SECRET" production --force --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          printf '%s' "$YOUTUBE_REFRESH_TOKEN" | vercel env add "YOUTUBE_REFRESH_TOKEN" production --force --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
      - name: Synchronize Mux TV credentials into Vercel production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID || secrets.MUX_ACCESS_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET || secrets.MUX_ACCESS_TOKEN_SECRET || secrets.MUX_SECRET_KEY }}
