          printf '%s' "$SRS_MEDIA_BASE_URL" | vercel env add "SRS_MEDIA_BASE_URL" production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          printf '%s' "$SRS_API_URL" | vercel env add "SRS_API_URL" production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          printf '%s' "$SRS_API_TOKEN" | vercel env add "SRS_API_TOKEN" production --force --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          printf '%s' "$SRS_FORWARD_SECRET" | vercel env add "SRS_FORWARD_SECRET" production --force --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
