name: Production Deployment Reconciliation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      force_federation_audit:
        description: "Force the full production ActivityPub contract audit"
        required: false
        default: true
        type: boolean

concurrency:
  group: production-deployment-reconciliation
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ORIGIN: "https://testagram.site"
  NPM_CONFIG_LOGLEVEL: error
  NODE_OPTIONS: --no-deprecation

jobs:
  reconcile-production:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve target SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$GITHUB_SHA"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::GitHub provided an invalid triggering SHA."; exit 1; }
          echo "Production reconciliation is immutable: deploying only the commit that triggered this run ($TARGET_SHA)."
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact target revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Prove checkout SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.sha }}"

      - name: Guard retired TV infrastructure
        shell: bash
        run: |
          set -euo pipefail
          # TV media is now owned by Testagram's native edge/control-plane path.
          # These SSH/SRS deployment hooks are retired and must never become a
          # production dependency again.
          retired_media_dir_prefix="media-"
          retired_media_dir_suffix="engine"
          retired_path_regex="(^|/)tv-srs(/|$)|(^|/)${retired_media_dir_prefix}${retired_media_dir_suffix}(/|[-_.]|$)"
          if git ls-files | grep -Ei "${retired_path_regex}" >/tmp/tv-retired-paths.txt; then
            echo "::error::Retired TV media infrastructure is still tracked in the production revision."
            cat /tmp/tv-retired-paths.txt
            exit 1
          fi
          legacy_ssh_prefix='MEDIA_'
          legacy_ssh_component='ENGINE'
          legacy_public_ip="${legacy_ssh_prefix}${legacy_ssh_component}_PUBLIC_IP"
          legacy_ssh_pattern="${legacy_ssh_prefix}${legacy_ssh_component}_SSH_(HOST|USER|PRIVATE_KEY)"
          if git grep -nE "${legacy_ssh_pattern}|${legacy_public_ip}" -- . ':!.git' ':!supabase/migrations/**' ':!.github/workflows/production-deployment-reconciliation.yml' >/tmp/tv-retired-config.txt; then
            echo "::error::Retired TV SSH configuration is still referenced in the production revision."
            cat /tmp/tv-retired-config.txt
            exit 1
          fi
          retired_provider_pattern='MEDIA_ENGINE_URL|MEDIA_ENGINE_SECRET|MUX_TOKEN_ID|MUX_TOKEN_SECRET|MUX_WEBHOOK_SIGNING_SECRET'
          if git grep -nE "${retired_provider_pattern}" -- . ':!.git' ':!supabase/migrations/**' ':!.github/workflows/production-deployment-reconciliation.yml' >/tmp/tv-retired-providers.txt; then
            echo "::error::Retired provider-specific TV configuration is still referenced in the production revision."
            cat /tmp/tv-retired-providers.txt
            exit 1
          fi
          echo "TV architecture guard passed: Testagram self-hosted CDN video transport + Supabase control-plane signing; no YouTube/Cloudflare video dependency."

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: npm run build

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.118.0

      - name: Verify Supabase management authentication
        id: supabase-auth
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "NOTICE:Supabase management token is not configured; Supabase reconciliation will be skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          output="$(SUPABASE_ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" supabase projects list --output json 2>&1)"
          status=$?
          set -e
          if (( status == 0 )); then
            echo "Supabase management authentication passed."
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qiE '401|unauthorized|invalid.*token|authentication' <<<"$output"; then
            echo "NOTICE:Supabase management API rejected the configured GitHub token (HTTP 401). Skipping optional Supabase reconciliation so Cloudflare production deployment can still be verified."
            echo "NOTICE:Rotate/update SUPABASE_ACCESS_TOKEN in the GitHub production environment to restore Edge Function reconciliation."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$output"
          echo "::error::Supabase management preflight failed for a non-authentication reason."
          exit 1

      # FCM credentials are production runtime secrets managed by Supabase, not source-control deployment inputs.
      # The notification-delivery-worker already supports its credential from the Edge secret
      # FCM_SERVICE_ACCOUNT_JSON and falls back to the locked Vault lookup. Do not copy a
      # Firebase service-account private key through GitHub on every application deployment.
      # This also prevents an obsolete Firebase project credential from blocking unrelated
      # production reconciliation after a credential rotation.

      - name: Reconcile and apply Supabase database migrations
        if: steps.supabase-auth.outputs.available == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ffrhglgkukgsuhxenena
          SUPABASE_URL: https://ffrhglgkukgsuhxenena.supabase.co
        run: |
          set -euo pipefail
          PROJECT_REF="$SUPABASE_PROJECT_REF"
          if [[ -z "$PROJECT_REF" ]]; then
            SUPABASE_HOST="${SUPABASE_URL#https://}"
            SUPABASE_HOST="${SUPABASE_HOST%%/*}"
            PROJECT_REF="${SUPABASE_HOST%%.*}"
          fi
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Unable to resolve a valid Supabase project ref for migration reconciliation."; exit 1; }

          # Production migration history predates the current repository and contains
          # migrations applied through Supabase MCP/management APIs whose timestamps and
          # filenames do not always match the repository copy. The verified identity-first
          # migration is now the production baseline. From this point forward CI only
          # applies repository migrations newer than that verified baseline, by migration name.
          SUPABASE_PROJECT_REF="$PROJECT_REF" SUPABASE_ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const projectRef = process.env.SUPABASE_PROJECT_REF;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const baselineVersion = "20261007115000";
          const baselineName = "enforce_identity_first_auth_boundary_and_didit_event_idempotency";
          const migrationsDir = path.join(process.cwd(), "supabase", "migrations");
          if (!token) throw new Error("SUPABASE_ACCESS_TOKEN is required for migration reconciliation.");
          if (!fs.existsSync(migrationsDir)) throw new Error("supabase/migrations directory is missing.");

          const historyUrl = "https://api.supabase.com/v1/projects/" + projectRef + "/database/migrations";
          const response = await fetch(historyUrl, { headers: { Authorization: "Bearer " + token, Accept: "application/json" } });
          const body = await response.text();
          if (!response.ok) throw new Error("Supabase migration history lookup failed (HTTP " + response.status + "): " + body.slice(0, 500));

          const remote = JSON.parse(body);
          const applied = new Set(Array.isArray(remote) ? remote.map((m) => String(m?.name || "")).filter(Boolean) : []);
          if (!applied.has(baselineName)) {
            throw new Error("Verified migration baseline is missing from production history: " + baselineName);
          }

          const files = fs.readdirSync(migrationsDir)
            .filter((name) => /^\d{14}_.+\.sql$/.test(name))
            .sort((a, b) => a.localeCompare(b));
          const pending = files.filter((file) => {
            const version = file.slice(0, 14);
            const name = file.slice(0, -4);
            return version > baselineVersion && !applied.has(name);
          });

          console.log("Production migration records: " + applied.size);
          console.log("Repository timestamped migrations: " + files.length);
          console.log("Migration baseline: " + baselineName);
          console.log("Pending migrations newer than baseline: " + pending.length);

          for (const file of pending) {
            const name = file.slice(0, -4);
            const query = fs.readFileSync(path.join(migrationsDir, file), "utf8");
            console.log("Applying migration newer than baseline: " + name);
            const apply = await fetch(historyUrl, {
              method: "POST",
              headers: { Authorization: "Bearer " + token, "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ name, query }),
            });
            const applyBody = await apply.text();
            if (!apply.ok) throw new Error("Migration failed for " + name + " (HTTP " + apply.status + "): " + applyBody.slice(0, 1000));
            console.log("Applied migration: " + name);
          }

          console.log("Supabase migration reconciliation passed from verified baseline.");
          NODE

      - name: Retire legacy LiveKit Edge Functions
        if: steps.supabase-auth.outputs.available == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ffrhglgkukgsuhxenena
          SUPABASE_URL: https://ffrhglgkukgsuhxenena.supabase.co
        run: |
          set -euo pipefail
          PROJECT_REF="$SUPABASE_PROJECT_REF"
          if [[ -z "$PROJECT_REF" ]]; then
            SUPABASE_HOST="${SUPABASE_URL#https://}"
            SUPABASE_HOST="${SUPABASE_HOST%%/*}"
            PROJECT_REF="${SUPABASE_HOST%%.*}"
          fi
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Unable to resolve Supabase project ref for LiveKit retirement."; exit 1; }
          for fn in livekit-tv-token livekit-token livekit-tv-guest-token livekit-space-token mux-tv-webhook; do
            echo "Retiring legacy TV Edge Function: $fn"
            supabase functions delete "$fn" --project-ref "$PROJECT_REF" --yes || true
          done
          echo "Legacy LiveKit/Mux TV Edge Function retirement completed."

      - name: Synchronize M-Pesa sandbox secrets into Supabase Edge Functions
        if: steps.supabase-auth.outputs.available == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ffrhglgkukgsuhxenena
          SUPABASE_URL: https://ffrhglgkukgsuhxenena.supabase.co
          MPESA_ENV: ${{ secrets.MPESA_ENV }}
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_USD_KES_RATE: ${{ secrets.MPESA_USD_KES_RATE }}
          MPESA_B2C_SHORTCODE: ${{ secrets.MPESA_B2C_SHORTCODE }}
          MPESA_INITIATOR_NAME: ${{ secrets.MPESA_INITIATOR_NAME }}
          MPESA_SECURITY_CRED: ${{ secrets.MPESA_SECURITY_CRED }}
        run: |
          set -euo pipefail

          PROJECT_REF="$SUPABASE_PROJECT_REF"
          if [[ -z "$PROJECT_REF" ]]; then
            PROJECT_REF="$(printf '%s' "$SUPABASE_URL" | sed -nE 's#https://([a-z0-9]+)\.supabase\.co/?$#\1#p')"
          fi
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is required for M-Pesa secret synchronization."; exit 1; }
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Unable to resolve a valid Supabase project ref for M-Pesa secret synchronization."; exit 1; }

          # M-Pesa is optional during the sandbox phase. Never substitute
          # fake/default credentials: if the real sandbox configuration is not
          # provisioned yet, keep reconciliation green and deploy the functions.
          # The runtime config-status endpoint will report STK as not ready.
          missing=()
          [[ -n "$MPESA_ENV" ]] || missing+=(MPESA_ENV)
          [[ -n "$MPESA_CONSUMER_KEY" ]] || missing+=(MPESA_CONSUMER_KEY)
          [[ -n "$MPESA_CONSUMER_SECRET" ]] || missing+=(MPESA_CONSUMER_SECRET)
          [[ -n "$MPESA_SHORTCODE" ]] || missing+=(MPESA_SHORTCODE)
          [[ -n "$MPESA_PASSKEY" ]] || missing+=(MPESA_PASSKEY)
          [[ -n "$MPESA_USD_KES_RATE" ]] || missing+=(MPESA_USD_KES_RATE)

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "NOTICE:M-Pesa sandbox secrets are not fully provisioned; skipping secret synchronization."
            echo "NOTICE:Missing sandbox configuration names: ${missing[*]}"
            echo "M-Pesa functions will still be deployed; STK readiness remains false until real sandbox credentials are added."
            exit 0
          fi

          case "$MPESA_ENV" in
            sandbox) ;;
            live)
              echo "::error::Live M-Pesa configuration is intentionally blocked by this sandbox-only deployment gate. Set MPESA_ENV=sandbox."
              exit 1
              ;;
            *) echo "::error::MPESA_ENV must be exactly 'sandbox' for the current deployment."; exit 1 ;;
          esac

          if ! [[ "$MPESA_USD_KES_RATE" =~ ^[0-9]+([.][0-9]+)?$ ]] || ! awk "BEGIN { exit !($MPESA_USD_KES_RATE > 0) }"; then
            echo "::error::MPESA_USD_KES_RATE must be a positive numeric value."
            exit 1
          fi

          umask 077
          TMP_ENV="$(mktemp)"
          trap 'rm -f "$TMP_ENV"' EXIT
          {
            printf 'MPESA_ENV=%s\n' "$MPESA_ENV"
            printf 'MPESA_CONSUMER_KEY=%s\n' "$MPESA_CONSUMER_KEY"
            printf 'MPESA_CONSUMER_SECRET=%s\n' "$MPESA_CONSUMER_SECRET"
            printf 'MPESA_SHORTCODE=%s\n' "$MPESA_SHORTCODE"
            printf 'MPESA_PASSKEY=%s\n' "$MPESA_PASSKEY"
            printf 'MPESA_USD_KES_RATE=%s\n' "$MPESA_USD_KES_RATE"
            if [[ -n "$MPESA_B2C_SHORTCODE" ]]; then printf 'MPESA_B2C_SHORTCODE=%s\n' "$MPESA_B2C_SHORTCODE"; fi
            if [[ -n "$MPESA_INITIATOR_NAME" ]]; then printf 'MPESA_INITIATOR_NAME=%s\n' "$MPESA_INITIATOR_NAME"; fi
            if [[ -n "$MPESA_SECURITY_CRED" ]]; then printf 'MPESA_SECURITY_CRED=%s\n' "$MPESA_SECURITY_CRED"; fi
          } > "$TMP_ENV"

          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$TMP_ENV"
          echo "M-Pesa sandbox secrets synchronized without printing secret values."

      - name: Deploy M-Pesa Edge Functions
        if: steps.supabase-auth.outputs.available == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ffrhglgkukgsuhxenena
          SUPABASE_URL: https://ffrhglgkukgsuhxenena.supabase.co
        run: |
          set -euo pipefail
          PROJECT_REF="$SUPABASE_PROJECT_REF"
          if [[ -z "$PROJECT_REF" ]]; then
            PROJECT_REF="$(printf '%s' "$SUPABASE_URL" | sed -nE 's#https://([a-z0-9]+)\.supabase\.co/?$#\1#p')"
          fi
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is required for M-Pesa Edge Function deployment."; exit 1; }
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Unable to resolve a valid Supabase project ref for M-Pesa deployment."; exit 1; }
          deploy_function() {
            local name="$1"
            local optional_arg="${2:-}"
            local attempt=1
            local max_attempts=4
            while true; do
              if [[ -n "$optional_arg" ]]; then
                if supabase functions deploy "$name" --use-api --project-ref "$PROJECT_REF" "$optional_arg"; then
                  return 0
                fi
              elif supabase functions deploy "$name" --use-api --project-ref "$PROJECT_REF"; then
                return 0
              fi
              if (( attempt >= max_attempts )); then
                echo "::error::Supabase Edge Function deployment failed after $max_attempts attempts: $name"
                return 1
              fi
              local delay=$((attempt * 20))
              echo "NOTICE:Supabase Edge Function deployment hit a transient registry/deployment failure for $name; retrying in ${delay}s (attempt $((attempt+1))/$max_attempts)."
              sleep "$delay"
              attempt=$((attempt+1))
            done
          }
          deploy_function mpesa-stk-push "--no-verify-jwt"
          deploy_function mpesa-stk-status
          deploy_function mpesa-config-status
          echo "M-Pesa sandbox Edge Functions deployed with callback-compatible JWT configuration."

      - name: Deploy Fediverse Edge Functions
        if: steps.supabase-auth.outputs.available == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ffrhglgkukgsuhxenena
          SUPABASE_URL: https://ffrhglgkukgsuhxenena.supabase.co
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is required for the Fediverse gateway deployment gate."; exit 1; }
          PROJECT_REF="$SUPABASE_PROJECT_REF"
          if [[ -z "$PROJECT_REF" ]]; then
            PROJECT_REF="$(printf '%s' "$SUPABASE_URL" | sed -nE 's#https://([a-z0-9]+)\.supabase\.co/?$#\1#p')"
          fi
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Unable to resolve a valid Supabase project ref."; exit 1; }
          # Supabase can return transient HTTP 500s while building/rolling out an Edge Function.
          # Treat deployment as a retryable infrastructure operation instead of failing the
          # entire production reconciliation on the first registry/control-plane error.
          deploy_function() {
            local name="$1"
            local flags="${2:-}"
            local attempt=1
            local max_attempts=4
            while true; do
              echo "Deploying Supabase Edge Function $name (attempt $attempt/$max_attempts)"
              if [[ "$flags" == "--no-verify-jwt" ]]; then
                if supabase functions deploy "$name" --use-api --project-ref "$PROJECT_REF" --no-verify-jwt; then
                  return 0
                fi
              elif supabase functions deploy "$name" --use-api --project-ref "$PROJECT_REF"; then
                return 0
              fi
              if (( attempt >= max_attempts )); then
                echo "::error::Supabase Edge Function deployment failed after $max_attempts attempts: $name"
                return 1
              fi
              local delay=$((attempt * 20))
              echo "NOTICE:Supabase deployment for $name returned a retryable failure; waiting ${delay}s before attempt $((attempt+1))/$max_attempts."
              sleep "$delay"
              attempt=$((attempt+1))
            done
          }

          # Canonical public ActivityPub surface. These functions are intentionally
          # reconciled here because Cloudflare only proxies to them; a green Worker
          # deployment is not sufficient if the Supabase federation functions are stale.
          deploy_function mastodon-federation "--no-verify-jwt"
          deploy_function federation-inbox "--no-verify-jwt"
          deploy_function gateway-relay "--no-verify-jwt"
          deploy_function federated-feed
          deploy_function megalodon-gateway
          # The production UI's Follow/Unfollow path is testagram-api -> federation-transport.
          # Keep both gateway functions reconciled with the same exact source revision.
          deploy_function testagram-api "--no-verify-jwt"
          # Testagram's public ActivityPub actor URLs are canonical on testagram.site.
          export FEDERATION_PUBLIC_ORIGIN="https://testagram.site"
          deploy_function federation-transport "--no-verify-jwt"
          # activitypub-federation was the retired duplicate client gateway. Remove the
          # live Edge Function as part of reconciliation so production has one canonical
          # outbound path: testagram-api -> federation-transport.
          supabase functions delete activitypub-federation --project-ref "$PROJECT_REF" --yes || true

          GATEWAY_URL="https://${PROJECT_REF}.supabase.co/functions/v1/gateway-relay?action=health"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$GATEWAY_URL" > fediverse-gateway-health.json
          node -e 'const fs=require("node:fs"); const body=fs.readFileSync("fediverse-gateway-health.json","utf8").trim(); let p; try { p=JSON.parse(body); } catch { console.error("Fediverse gateway returned invalid JSON:", body); process.exit(1); } if (p?.ok !== true || p?.service !== "gateway-relay" || p?.backend !== "supabase") { console.error("Fediverse gateway contract failed:", JSON.stringify(p)); process.exit(1); } console.log("Fediverse gateway gate passed:", JSON.stringify(p));'

      - name: Deploy Testagram notification Edge Functions
        if: steps.supabase-auth.outputs.available == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ffrhglgkukgsuhxenena
          SUPABASE_URL: https://ffrhglgkukgsuhxenena.supabase.co
        run: |
          set -euo pipefail

          PROJECT_REF="$SUPABASE_PROJECT_REF"
          if [[ -z "$PROJECT_REF" ]]; then
            PROJECT_REF="$(printf '%s' "$SUPABASE_URL" | sed -nE 's#https://([a-z0-9]+)\.supabase\.co/?$#\1#p')"
          fi

          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is required for notification deployment."; exit 1; }
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Unable to resolve a valid Supabase project ref for notification deployment."; exit 1; }

          deploy_notification_function() {
            local name="$1"
            local attempt=1
            local max_attempts=4
            while true; do
              echo "Deploying notification Edge Function $name (attempt $attempt/$max_attempts)"
              if supabase functions deploy "$name" --use-api --project-ref "$PROJECT_REF" --no-verify-jwt; then
                return 0
              fi
              if (( attempt >= max_attempts )); then
                echo "::error::Notification Edge Function deployment failed after $max_attempts attempts: $name"
                return 1
              fi
              local delay=$((attempt * 20))
              echo "NOTICE:Notification deployment returned a retryable failure; waiting ${delay}s before attempt $((attempt+1))/$max_attempts."
              sleep "$delay"
              attempt=$((attempt+1))
            done
          }

          # notification-delivery-worker is the canonical scheduled FCM worker.
          # notification-fcm-worker is a legacy duplicate and is intentionally retired so
          # two independent workers cannot consume the same durable notification outbox.
          supabase functions delete notification-fcm-worker --project-ref "$PROJECT_REF" --yes || true
          deploy_notification_function notification-delivery-worker
          deploy_notification_function novu-notification-delivery
          deploy_notification_function register-push-token

          echo "Testagram notification Edge Functions deployed and reconciled."

      - name: Deploy Testagram Ads Edge Functions
        if: steps.supabase-auth.outputs.available == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ffrhglgkukgsuhxenena
          SUPABASE_URL: https://ffrhglgkukgsuhxenena.supabase.co
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::SUPABASE_ACCESS_TOKEN is required for the Testagram Ads deployment gate."; exit 1; }
          PROJECT_REF="$SUPABASE_PROJECT_REF"
          if [[ -z "$PROJECT_REF" ]]; then
            PROJECT_REF="$(printf '%s' "$SUPABASE_URL" | sed -nE 's#https://([a-z0-9]+)\.supabase\.co/?$#\1#p')"
          fi
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Unable to resolve a valid Supabase project ref."; exit 1; }

          # Repair stale legacy import-map metadata before deploying the Ads functions.
          # The affected functions were previously registered with an import_map_path
          # pointing at an old ephemeral /tmp deployment path. That metadata survives
          # source changes and causes the Supabase API to return HTTP 500 during deploy.
          # Current functions use function-local deno.json (Deno config), not legacy
          # import maps, so clear only that stale remote metadata in-place.
          functions_json="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions")"
          for fn in zenad-decision zenad-campaign zenad-ad-asset-upload; do
            state="$(printf '%s' "$functions_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const n=process.argv[1];const f=(Array.isArray(a)?a:[]).find(x=>x.slug===n);process.stdout.write(f?JSON.stringify({import_map:f.import_map===true,import_map_path:f.import_map_path||""}):"{}")})' "$fn")"
            if [[ "$state" == *'"import_map":true'* && "$state" == *'"import_map_path":"file:'* ]]; then
              echo "Repairing stale import-map metadata for $fn: $state"
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                --request PATCH \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                --data '{"import_map":false}' \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$fn" >/dev/null
            fi
          done

          deploy_ads_function() {
            local name="$1"
            local flags="${2:-}"
            local attempt=1
            local max_attempts=4
            while true; do
              echo "Deploying Testagram Ads Edge Function $name (attempt $attempt/$max_attempts)"
