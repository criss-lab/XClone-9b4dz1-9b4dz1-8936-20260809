name: Native Media Engine Check
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "media-engine/**"
      - "src/lib/testagramMedia.ts"
      - "supabase/functions/testagram-media-token/**"
      - "src/pages/TvStudioPage.tsx"
      - "src/pages/TvPublicLivePage.tsx"
      - "package.json"
jobs:
  media-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Normalize Go formatting
        working-directory: media-engine
        run: gofmt -w main.go main_test.go
      - name: Resolve Go module graph
        working-directory: media-engine
        run: go mod tidy
      - name: Go build
        working-directory: media-engine
        run: go build ./...
