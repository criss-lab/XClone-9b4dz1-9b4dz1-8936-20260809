name: Infrastructure Reconciliation Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_repair:
        description: "Allow only bounded, non-destructive repairs"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: infrastructure-reconciliation-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTHORITATIVE_REPO: Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr
      AUTHORITATIVE_BRANCH: main
      AUTHORITATIVE_SHA: ${{ github.sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify immutable repository fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${AUTHORITATIVE_REPO}" || {
            echo "::error::Repository lineage mismatch: ${GITHUB_REPOSITORY}"
            exit 1
          }
          test "${GITHUB_REF_NAME}" = "${AUTHORITATIVE_BRANCH}" || {
            echo "::error::Branch mismatch: ${GITHUB_REF_NAME}"
            exit 1
          }
          test "${GITHUB_SHA}" = "${AUTHORITATIVE_SHA}" || {
            echo "::error::SHA changed during reconciliation"
            exit 1
          }
          echo "AUTHORITATIVE_REPO=${AUTHORITATIVE_REPO}"
          echo "AUTHORITATIVE_BRANCH=${AUTHORITATIVE_BRANCH}"
          echo "AUTHORITATIVE_SHA=${AUTHORITATIVE_SHA}"

      - name: Verify CI candidate is not running from an untrusted ref
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            push|workflow_dispatch) ;;
            *) echo "::error::Unsupported event ${GITHUB_EVENT_NAME}"; exit 1 ;;
          esac

      - name: Probe Supabase PostgreSQL through IPv4 Supavisor
        shell: bash
        env:
          EXPECTED_SUPABASE_PROJECT_REF: "ffrhglgkukgsuhxenena"
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::SUPABASE_DB_URL is not configured; database boundary remains QUARANTINED."
            echo "::warning::Configure the production SUPABASE_DB_URL from Supabase Connect -> Session pooler (Supavisor), not the direct db.*.supabase.co endpoint."
            exit 0
          fi

          # Never print the connection string: it contains the database password.
          printf '::add-mask::%s\n' "${SUPABASE_DB_URL}"

          # Supabase's Shared Pooler (Supavisor) is IPv4-only. The direct
          # db.<project>.supabase.co endpoint is IPv6 unless the project has
          # the IPv4 add-on. This gate deliberately requires the pooler host.
          node <<'NODE'
          const raw = process.env.SUPABASE_DB_URL;
          let u;
          try { u = new URL(raw); } catch { console.error("::error::SUPABASE_DB_URL is not a valid PostgreSQL URL."); process.exit(1); }
          if (!/^postgres(?:ql)?:$/.test(u.protocol)) { console.error("::error::SUPABASE_DB_URL must use postgres:// or postgresql://."); process.exit(1); }
          if (!/\.pooler\.supabase\.com$/i.test(u.hostname)) {
            console.error("::error::SUPABASE_DB_URL is not using the IPv4 Supavisor pooler hostname.");
            process.exit(1);
          }
          const port = u.port || "5432";
          if (port !== "5432") {
            console.error("::error::Infrastructure forensic probe requires Supavisor Session mode on port 5432.");
            process.exit(1);
          }
          const username = decodeURIComponent(u.username || "");
          const expected = process.env.EXPECTED_SUPABASE_PROJECT_REF;
          if (username.startsWith("postgres.") && !username.endsWith("." + expected)) {
            console.error("::error::SUPABASE_DB_URL username is bound to a different Supabase project ref.");
            process.exit(1);
          }
          console.log("DB_ROUTE=SUPAVISOR_SESSION_IPV4");
          console.log("DB_PORT=5432");
          console.log("DB_PROJECT_REF_CHECK=PASSED");
          NODE

          # Diagnose DNS and TCP before retrying PostgreSQL. pg_isready alone hides
          # whether the failure is DNS, TCP, TLS, or PostgreSQL authentication.
          db_host="$(node -e 'const u=new URL(process.env.SUPABASE_DB_URL); process.stdout.write(u.hostname)')"
          db_port="$(node -e 'const u=new URL(process.env.SUPABASE_DB_URL); process.stdout.write(u.port || "5432")')"

          echo "SUPABASE_DB_HOST=${db_host}"
          echo "SUPABASE_DB_PORT=${db_port}"
          echo "SUPABASE_DB_IPV4_ADDRESSES:"
          getent ahostsv4 "${db_host}" | awk '{print $1}' | sort -u | sed 's/^/  /' || true

          ipv4_addresses="$(getent ahostsv4 "${db_host}" | awk '{print $1}' | sort -u)"
          if [ -z "${ipv4_addresses}" ]; then
            echo "::error::Supavisor hostname has no IPv4 DNS answer from the GitHub runner."
            exit 1
          fi

          tcp_ok=false
          while IFS= read -r ip; do
            [ -n "${ip}" ] || continue
            echo "IPv4 TCP probe: ${ip}:${db_port}"
            if timeout 10 bash -c ">/dev/tcp/${ip}/${db_port}" 2>/dev/null; then
              echo "SUPABASE_DB_TCP_IPV4_REACHABLE=true"
              tcp_ok=true
              break
            fi
          done <<< "${ipv4_addresses}"

          if [ "${tcp_ok}" != "true" ]; then
            echo "::error::Supavisor has IPv4 DNS, but TCP port ${db_port} is unreachable from the GitHub-hosted runner."
            echo "::error::This is a network-path failure, not a database-password failure."
            exit 1
          fi

          # The shared Supavisor Session endpoint is IPv4-only. Force libpq to
          # use the resolved IPv4 address so a dual-stack DNS answer cannot
          # select an unreachable IPv6 path.
          PGHOSTADDR="$(printf '%s\n' "${ipv4_addresses}" | head -n1)"
          export PGHOSTADDR

          for delay in 5 15 30; do
            echo "IPv4 Supavisor PostgreSQL readiness probe; retry window ${delay}s"
            if PGHOSTADDR="${PGHOSTADDR}" pg_isready "${SUPABASE_DB_URL}" >/dev/null 2>&1; then
              echo "SUPABASE_DB_REACHABLE=true"
              break
            fi
            sleep "${delay}"
          done

          # pg_isready can disagree with a URI-based SSL/authenticated probe on
          # Supavisor. Treat it as diagnostic only; the authenticated SQL probe
          # below is the authoritative PostgreSQL readiness check.
          if PGHOSTADDR="${PGHOSTADDR}" pg_isready "${SUPABASE_DB_URL}" >/dev/null 2>&1; then
            echo "SUPABASE_DB_PG_ISREADY=true"
          else
            echo "SUPABASE_DB_PG_ISREADY=false"
            echo "SUPABASE_DB_PG_ISREADY_NONFATAL=true"
          fi

          # Execute a real authenticated read-only SQL query before declaring
          # the DB boundary green.
          export PGSSLMODE=require
          if ! PGHOSTADDR="${PGHOSTADDR}" psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atq <<'SQL' >/tmp/db-connect-test.txt 2>&1
          select 1;
          SQL
          then
            echo "::error::Authenticated PostgreSQL probe failed after IPv4 TCP connectivity was confirmed."
            sed -E 's/(postgresql?:\\/\\/[^:]+:)[^@]+(@)/\\1***\\2/g' /tmp/db-connect-test.txt | tail -n 12
            exit 1
          fi
          echo "SUPABASE_DB_AUTHENTICATED=true"
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atq <<'SQL' >/tmp/db-identity.txt
          select
            current_database(),
            coalesce(inet_server_addr()::text, 'unknown'),
            coalesce(inet_client_addr()::text, 'unknown'),
            version();
          SQL

          echo "SUPABASE_DB_SQL_REACHABLE=true"
          echo "Database identity probe completed without printing credentials."

          # Verify the exact production federation tables exist. This is read-only.
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atq <<'SQL' >/tmp/federation-tables.txt
          select table_name
          from information_schema.tables
          where table_schema = 'public'
            and table_name in (
              'activitypub_inbox',
              'activitypub_outbox',
              'federated_follow_relationships',
              'federated_objects',
              'federation_remote_cache'
            )
          order by table_name;
          SQL

          expected_tables=5
          actual_tables="$(wc -l </tmp/federation-tables.txt | tr -d ' ')"
          if [ "${actual_tables}" -ne "${expected_tables}" ]; then
            echo "::error::Production federation schema probe found ${actual_tables}/${expected_tables} required tables."
            exit 1
          fi
          echo "FEDERATION_SCHEMA_REACHABLE=true"

          # Emit only counts/status, never row payloads or secrets.
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atq <<'SQL' | while IFS='|' read -r table_name row_count; do
          select 'activitypub_inbox', count(*) from public.activitypub_inbox
          union all
          select 'activitypub_outbox', count(*) from public.activitypub_outbox
          union all
          select 'federated_follow_relationships', count(*) from public.federated_follow_relationships
          union all
          select 'federated_objects', count(*) from public.federated_objects
          union all
          select 'federation_remote_cache', count(*) from public.federation_remote_cache
          order by 1;
          SQL
            echo "DB_TABLE_COUNT ${table_name}=${row_count}"
          done

          echo "SUPABASE_DB_FORENSIC_PROBE=GREEN"

      - name: Verify Vercel deployment lineage when credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::warning::Vercel reconciliation credentials are not configured; deployment lineage remains QUARANTINED."
            exit 0
          fi
          api="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}"
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then
            api="${api}?teamId=${VERCEL_TEAM_ID}"
          fi
          body="$(curl -fsSL -H "Authorization: Bearer ${VERCEL_TOKEN}" "${api}")"
          repo="$(printf '%s' "${body}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s); console.log(j.link?.repo||"")})')"
          branch="$(printf '%s' "${body}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s); console.log(j.link?.productionBranch||"")})')"
          echo "Vercel linked repo: ${repo:-UNKNOWN}"
          echo "Vercel production branch: ${branch:-UNKNOWN}"
          if [ "${repo}" != "${AUTHORITATIVE_REPO}" ]; then
            echo "::warning::Vercel Git lineage mismatch; automatic repository switching is deliberately forbidden."
            exit 0
          fi
          if [ -n "${branch}" ] && [ "${branch}" != "${AUTHORITATIVE_BRANCH}" ]; then
            echo "::warning::Vercel production branch mismatch."
            exit 0
          fi
          echo "VERCEL_LINEAGE=VERIFIED"

      - name: Emit reconciliation receipt
        shell: bash
        run: |
          set -euo pipefail
          cat <<EOF
          {
            "repository": "${AUTHORITATIVE_REPO}",
            "branch": "${AUTHORITATIVE_BRANCH}",
            "commit": "${AUTHORITATIVE_SHA}",
            "event": "${GITHUB_EVENT_NAME}",
            "database_policy": "read-only-until-live-schema-is-proven",
            "vercel_policy": "never-switch-lineage-without-explicit-reconciliation",
            "deployment_policy": "never-promote-unverified-sha"
          }
          EOF
