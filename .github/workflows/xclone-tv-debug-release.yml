name: XClone TV Public Test APK

on:
  push:
    branches: [main]
    paths:
      - "android-tv/**"
      - ".github/workflows/xclone-tv-debug-release.yml"
  pull_request:
    paths:
      - "android-tv/**"
      - ".github/workflows/xclone-tv-debug-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xclone-tv-public-test
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build TV debug APK
        working-directory: android-tv
        run: chmod +x ../android/gradlew && ../android/gradlew --no-daemon --console=plain --stacktrace --build-cache assembleDebug
      - name: Verify package and TV launcher
        shell: bash
        run: |
          set -euo pipefail
          APK="android-tv/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/xclone-tv-badging.txt"
          grep -q "package: name='com.xclone.app.tv.debug'" "$RUNNER_TEMP/xclone-tv-badging.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee "$RUNNER_TEMP/xclone-tv-manifest.txt"
          grep -q "android.intent.category.LEANBACK_LAUNCHER" "$RUNNER_TEMP/xclone-tv-manifest.txt"
          cp "$APK" xclone-tv-debug.apk
          sha256sum xclone-tv-debug.apk
          ls -lh xclone-tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xclone-tv-public-test-apk
          path: xclone-tv-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish public TV testing download
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xclone-tv-public-test-apk
          path: release-assets
      - name: Publish TV test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-test-v0.1.${{ github.run_number }}
          name: XClone TV Test APK v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Public **testing** build for Android TV / Google TV.

            - APK: `xclone-tv-debug.apk`
            - Package: `com.xclone.app.tv.debug`
            - This is a debug-signed test build, not the stable signed production release.
            - Real-device D-pad focus, sign-in/session persistence, Back behavior and IPTV/video playback are not certified by a successful CI build.
          files: release-assets/xclone-tv-debug.apk
