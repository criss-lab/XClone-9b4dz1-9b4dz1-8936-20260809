name: Community Admin Runtime Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/community-admin-runtime/**'
      - 'supabase/config.toml'
      - '.github/workflows/community-admin-runtime.yml'

concurrency:
  group: community-admin-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  acceptance:
    name: Supabase-hosted community admin acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for controller endpoint to be live
        shell: bash
        run: |
          set -euo pipefail
          url='https://aepbqfrmheihfsauzcby.supabase.co/functions/v1/community-admin-runtime'
          for attempt in 1 2 3 4 5 6; do
            http_status="$(curl --max-time 10 --silent --show-error --output /dev/null --write-out '%{http_code}' "$url" || true)"
            if [[ "$http_status" == '405' ]]; then
              echo "controller endpoint is live (GET -> 405)"
              exit 0
            fi
            echo "controller endpoint not ready (http=${http_status:-transport-failure}), attempt ${attempt}/6"
            sleep $((attempt * 5))
          done
          echo 'controller endpoint did not become ready'
          exit 1

      - name: Mint GitHub Actions OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Faepbqfrmheihfsauzcby.supabase.co%2Ffunctions%2Fv1%2Fcommunity-admin-runtime"
          token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${token_url}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"
          {
            echo 'token<<EOF'
            echo "$token"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Supabase-hosted acceptance controller
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          url='https://aepbqfrmheihfsauzcby.supabase.co/functions/v1/community-admin-runtime'
          response_file="$(mktemp)"
          status=0
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --output "$response_file" \
            --write-out '%{http_code}' "$url" > /tmp/http-status || status=$?
          http_status="$(cat /tmp/http-status 2>/dev/null || true)"
          cat "$response_file"
          echo
          if [[ "$status" -ne 0 || "$http_status" != '200' ]]; then
            echo "Community-admin acceptance controller failed (transport=${status}, http=${http_status:-unknown})."
            exit 1
          fi
          python - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              report = json.load(f)
          if report.get('ok') is not True or report.get('status') != 'passed':
              raise SystemExit(f"ACCEPTANCE_CONTROLLER_FAILED:{report.get('code', 'unknown')}")
          print('COMMUNITY_ADMIN_RUNTIME_ACCEPTANCE=PASS')
          print(f"controller_version={report.get('controller_version')}")
          print(f"attempt={report.get('attempt')}")
          for check in report.get('checks', []):
              print(f"check={check}")
          PY
