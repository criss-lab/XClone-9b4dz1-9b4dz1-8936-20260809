name: Vercel Production Deploy
# Pending-state federation compatibility is part of the production reconciliation.
# Federated interaction compatibility is deployed with the exact main revision.

on:
  # Automatic production deployment is owned by production-deployment-reconciliation.yml.
  # This workflow remains manual for controlled exact-revision deployments.
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy this exact revision to Vercel'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy exact main revision
    environment: production
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN || 'https://testagram.site' }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.sha }}"
          test "$actual" = "$expected"
          echo "Verified source SHA: $actual"

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Reset Vercel local linkage
        shell: bash
        run: rm -rf .vercel

      - name: Link exact Vercel project
        run: vercel link --yes --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Synchronize Supabase public configuration into Vercel production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://ffrhglgkukgsuhxenena.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_h51Z3EHP2LN5o7HdRAB3Og_uhUA3oya' }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Supabase public URL is missing"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Supabase publishable key is missing"; exit 1; }
          printf '%s' "$SUPABASE_URL" | vercel env add "SUPABASE_URL" production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | vercel env add "SUPABASE_PUBLISHABLE_KEY" production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          printf '%s' "$SUPABASE_URL" | vercel env add "VITE_SUPABASE_URL" production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | vercel env add "VITE_SUPABASE_PUBLISHABLE_KEY" production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          echo "Supabase public configuration synchronized without printing key values."

      - name: Synchronize SMS secrets into Vercel production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SEND_SMS_HOOK_SECRETS: ${{ secrets.SEND_SMS_HOOK_SECRETS || secrets.SEND_SMS_HOOK_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SMS_RATE_LIMIT_SECRET: ${{ secrets.SMS_RATE_LIMIT_SECRET }}
          SMS_GATEWAY_URL: ${{ secrets.SMS_GATEWAY_URL || secrets.AFRICASTALKING_SMS_URL || vars.SMS_GATEWAY_URL }}
          SMS_GATEWAY_API_KEY: ${{ secrets.SMS_GATEWAY_API_KEY || secrets.AFRICASTALKING_API_KEY }}
          SMS_GATEWAY_USERNAME: ${{ secrets.SMS_GATEWAY_USERNAME || secrets.AFRICASTALKING_USERNAME || secrets.AFRICA_TALKING_USERNAME || secrets.AFRICAS_TALKING_USERNAME || secrets.AT_USERNAME || vars.SMS_GATEWAY_USERNAME || vars.AFRICASTALKING_USERNAME }}
          SMS_SENDER_NAME: ${{ secrets.SMS_SENDER_NAME || secrets.AFRICASTALKING_SENDER_ID || vars.SMS_SENDER_NAME || 'Testagram' }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Required GitHub secret/configuration is missing: $name"
              exit 1
            fi
            printf '::add-mask::%s\n' "$value"
          }

          put_production_secret() {
            local name="$1"
            local value="$2"
            require_secret "$name" "$value"
            printf '%s' "$value" | vercel env add "$name" production --force --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          }

          put_production_secret "SEND_SMS_HOOK_SECRETS" "$SEND_SMS_HOOK_SECRETS"
          put_production_secret "SUPABASE_URL" "$SUPABASE_URL"
          put_production_secret "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY"
          put_production_secret "SMS_RATE_LIMIT_SECRET" "$SMS_RATE_LIMIT_SECRET"
          put_production_secret "SMS_GATEWAY_API_KEY" "$SMS_GATEWAY_API_KEY"

          # Africa's Talking Sandbox has one fixed authentication username and a
          # separate Sandbox API host. Keep the two values coupled so a stale
          # live URL cannot be combined with Sandbox credentials.
          if [[ -z "$SMS_GATEWAY_USERNAME" ]]; then
            if [[ "$SMS_GATEWAY_URL" =~ (^|[./])sandbox([./]|$) ]]; then
              SMS_GATEWAY_USERNAME="sandbox"
              echo "Africa's Talking Sandbox endpoint detected; using the documented Sandbox username."
            else
              echo "::error::SMS_GATEWAY_USERNAME is missing. Configure the live Africa's Talking application username in GitHub production."
              exit 1
            fi
          fi

          if [[ "$SMS_GATEWAY_USERNAME" == "sandbox" ]]; then
            SMS_GATEWAY_URL="https://api.sandbox.africastalking.com/version1/messaging"
            echo "Africa's Talking Sandbox mode selected; using the canonical Sandbox SMS endpoint."
          elif [[ "$SMS_GATEWAY_URL" =~ (^|[./])sandbox([./]|$) ]]; then
            echo "::error::A Sandbox Africa's Talking endpoint cannot be used with a live application username."
            exit 1
          fi

          put_production_secret "SMS_GATEWAY_URL" "$SMS_GATEWAY_URL"
          put_production_secret "SMS_GATEWAY_USERNAME" "$SMS_GATEWAY_USERNAME"
          if [[ -n "$SMS_SENDER_NAME" ]]; then
            put_production_secret "SMS_SENDER_NAME" "$SMS_SENDER_NAME"
          else
            echo "SMS_SENDER_NAME not supplied; preserving provider/default sender configuration."
          fi

          echo "SMS production environment synchronized without printing secret values."

      - name: Synchronize Cloudflare R2 secrets into Vercel production
        shell: bash
        env:
          VERCEL_TOKEN: ${{secrets.VERCEL_TOKEN}}
          R2_ACCOUNT_ID: ${{secrets.R2_ACCOUNT_ID}}
          R2_ACCESS_KEY_ID: ${{secrets.R2_ACCESS_KEY_ID}}
          R2_SECRET_ACCESS_KEY: ${{secrets.R2_SECRET_ACCESS_KEY}}
          R2_MEDIA_BUCKET: ${{secrets.R2_MEDIA_BUCKET || vars.R2_MEDIA_BUCKET}}
          R2_PUBLIC_BASE_URL: ${{secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL}}
        run: |
          set -euo pipefail
          put_r2_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then echo "::error::Required R2 production configuration is missing: $name"; exit 1; fi
            printf "::add-mask::%s\n" "$value"
            printf "%s" "$value" | vercel env add "$name" production --force --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          }
          put_r2_secret "R2_ACCOUNT_ID" "$R2_ACCOUNT_ID"
          put_r2_secret "R2_ACCESS_KEY_ID" "$R2_ACCESS_KEY_ID"
          put_r2_secret "R2_SECRET_ACCESS_KEY" "$R2_SECRET_ACCESS_KEY"
          put_r2_secret "R2_MEDIA_BUCKET" "$R2_MEDIA_BUCKET"
          if [[ -n "$R2_PUBLIC_BASE_URL" ]]; then put_r2_secret "R2_PUBLIC_BASE_URL" "$R2_PUBLIC_BASE_URL"; fi
          printf "%s" "$APP_ORIGIN" | vercel env add "APP_ORIGIN" production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          echo "R2 production environment synchronized without printing secret values."

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel production output
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy exact build to Vercel production
        if: ${{ inputs.deploy == true }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}


  recover-known-good:
    name: Recover known-good production alias during Vercel quota outage
    if: ${{ github.event.before == '2f95ac93814c12b7126902b08f45b7a4965cea69' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Promote last known-good deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote kooone-9b4dz1-9b4dz1-8936-20260809tr-rila53fsm.vercel.app --scope criss-projects-7c0f74aa --token="$VERCEL_TOKEN" --yes

# Deployment trigger: run against the latest main revision.
# Exact-SHA deployment proof trigger.

# Count synchronization trigger: deploy the current federation count implementation.
# Interaction durability trigger: validate like, repost, reply persistence and instant UI counts.
# Final interaction visibility reconciliation trigger.

# Federated reaction persistence target normalization trigger.

# Supabase auth persistence hardening trigger.
