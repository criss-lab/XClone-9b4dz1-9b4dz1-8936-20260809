name: Testagram Federation Worker Secret Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testagram-federation-worker-secret-sync
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: aepbqfrmheihfsauzcby

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FEDERATION_WORKER_KEY: ${{ secrets.FEDERATION_WORKER_KEY }}
    steps:
      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$FEDERATION_WORKER_KEY" || { echo 'Missing FEDERATION_WORKER_KEY.'; exit 1; }
          case "$SUPABASE_ACCESS_TOKEN" in sbp_*) ;; *) echo 'SUPABASE_ACCESS_TOKEN must be a Supabase personal access token.'; exit 1 ;; esac
      - name: Install Supabase CLI
        run: npm install --global supabase@latest
      - name: Verify project access
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"
          test "$status" = 200
      - name: Synchronize FEDERATION_WORKER_KEY
        env:
          FEDERATION_WORKER_KEY: ${{ secrets.FEDERATION_WORKER_KEY }}
        run: |
          set -euo pipefail
          supabase secrets set "FEDERATION_WORKER_KEY=$FEDERATION_WORKER_KEY" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify delivery worker authorization boundary
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/forbidden.json -w '%{http_code}' --max-time 20 -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/federation-delivery-worker")"
          echo "Unauthenticated delivery worker status: $status"
          cat /tmp/forbidden.json
          test "$status" = 403
