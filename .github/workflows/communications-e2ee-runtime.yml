name: Communications E2EE Runtime Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/pages/MessagesPage.tsx'
      - 'src/services/communicationCrypto.ts'
      - 'src/services/communicationService.ts'
      - 'src/lib/supabase.ts'
      - 'scripts/verify-communications-e2ee-browser.mjs'
      - '.github/workflows/communications-e2ee-runtime.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: communications-e2ee-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-acceptance:
    name: Two-account browser + LiveKit acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2EE_TEST_A_EMAIL: ${{ secrets.E2EE_TEST_A_EMAIL }}
      E2EE_TEST_A_PASSWORD: ${{ secrets.E2EE_TEST_A_PASSWORD }}
      E2EE_TEST_B_EMAIL: ${{ secrets.E2EE_TEST_B_EMAIL }}
      E2EE_TEST_B_PASSWORD: ${{ secrets.E2EE_TEST_B_PASSWORD }}
      E2EE_TEST_FORENSIC_KEY: ${{ secrets.E2EE_TEST_FORENSIC_KEY }}
      E2EE_TEST_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check optional runtime acceptance configuration
        id: runtime_config
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VITE_SUPABASE_URL
            VITE_SUPABASE_ANON_KEY
            E2EE_TEST_A_EMAIL
            E2EE_TEST_A_PASSWORD
            E2EE_TEST_B_EMAIL
            E2EE_TEST_B_PASSWORD
            E2EE_TEST_FORENSIC_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf 'runtime_configured=false\n' >> "$GITHUB_OUTPUT"
            printf 'Runtime acceptance not executed; missing required CI secrets: %s\n' "${missing[*]}"
            exit 0
          fi
          printf 'runtime_configured=true\n' >> "$GITHUB_OUTPUT"
          echo 'All runtime acceptance secrets are configured.'

      - name: Install application dependencies
        if: steps.runtime_config.outputs.runtime_configured == 'true'
        run: npm ci

      - name: Install pinned Playwright runtime
        if: steps.runtime_config.outputs.runtime_configured == 'true'
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium and CI media dependencies
        if: steps.runtime_config.outputs.runtime_configured == 'true'
        run: npx playwright@1.55.0 install --with-deps chromium

      - name: Build production application
        if: steps.runtime_config.outputs.runtime_configured == 'true'
        run: npm run build

      - name: Start production preview
        if: steps.runtime_config.outputs.runtime_configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/testagram-preview.log 2>&1 &
          preview_pid=$!
          echo "$preview_pid" > /tmp/testagram-preview.pid
          # shellcheck disable=SC2034
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/testagram-preview.log
          exit 1

      - name: Run strict two-account E2EE + LiveKit acceptance
        if: steps.runtime_config.outputs.runtime_configured == 'true'
        run: node scripts/verify-communications-e2ee-browser.mjs

      - name: Upload runtime evidence on failure
        if: failure() && steps.runtime_config.outputs.runtime_configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: communications-e2ee-runtime-failure-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/**
            /tmp/testagram-preview.log

      - name: Emit runtime acceptance status
        if: always()
        env:
          RUNTIME_CONFIGURED: ${{ steps.runtime_config.outputs.runtime_configured || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$RUNTIME_CONFIGURED" == "true" ]]; then
            {
              echo "### Communications E2EE Runtime Acceptance"
              echo "Live two-account E2EE + LiveKit acceptance was executed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Communications E2EE Runtime Acceptance"
              echo "Runtime acceptance was not executed because its dedicated CI secrets are not configured."
              echo "This is a configuration state, not an E2EE pass claim."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
