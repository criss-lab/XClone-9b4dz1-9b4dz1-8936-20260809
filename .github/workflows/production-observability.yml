name: Testagram Production Observability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/production-observability.mjs'
      - '.github/workflows/production-observability.yml'
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-observability
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run independent production probes
        id: probe
        run: node scripts/production-observability.mjs
      - name: Manage observability incident
        if: always()
        uses: actions/github-script@v8
        env:
          PROBE_RESULT: ${{ steps.probe.outcome }}
        with:
          script: |
            try {
              const title = 'PROD OBSERVABILITY: Testagram production probe failure';
              const { owner, repo } = context.repo;
              const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 50 });
              const existing = issues.find(issue => issue.title === title);
              if (process.env.PROBE_RESULT === 'success') {
                if (existing) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: 'Recovery verified at ' + new Date().toISOString() + '. Independent production probes are green.' });
                  await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
                }
                return;
              }
              const body = ['The independent production observability probe failed.','', 'Run: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId, 'Detected: ' + new Date().toISOString(), '', 'Inspect /api/health, /api/ready, cdn.testagram.site/health, Supabase logs and Cloudflare Worker observability.'].join('\n');
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: 'Probe still failing at ' + new Date().toISOString() + '.\n\n' + body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
            } catch (error) {
              if (error?.status === 410) {
                core.warning('GitHub Issues are disabled for this repository; preserving probe result without incident issue creation.');
                return;
              }
              throw error;
            }