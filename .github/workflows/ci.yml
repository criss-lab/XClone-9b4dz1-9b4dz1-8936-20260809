name: Testagram CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ci/**", "feature/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (retry transient release-download failures)
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Dependency install attempt ${attempt}/3"
            if npm ci --no-audit --no-fund > /tmp/npm-ci-attempt.log 2>&1; then
              cat /tmp/npm-ci-attempt.log
              exit 0
            else
              status=$?
            fi
            cat /tmp/npm-ci-attempt.log
            if [ "${attempt}" -lt 3 ] && grep -Eqi 'statusCode: 50[234]|HTTP[^[:cntrl:]]*50[234]|ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENETUNREACH|socket hang up|network timeout' /tmp/npm-ci-attempt.log; then
              delay=$((attempt * 15))
              echo "Transient upstream/network failure detected (exit ${status}); retrying in ${delay}s." >&2
              sleep "${delay}"
              continue
            fi
            echo "Dependency installation failed without a retryable network error (exit ${status}), or all retries were exhausted." >&2
            exit "${status}"
          done
          exit 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck identity functions
        run: |
          deno check --no-config supabase/functions/identity-signup/index.ts
          deno check --no-config supabase/functions/identity-verification/index.ts
          deno check --no-config supabase/functions/identity-engine-result/index.ts
          deno check --no-config supabase/functions/identity-engine-worker/index.ts
          deno check --no-config supabase/functions/media-delivery/index.ts
          deno check --no-config supabase/functions/zenad-decision/index.ts
          deno check --no-config supabase/functions/zenad-event/index.ts

  android-tv:
    name: Build and verify XClone TV APK
    # Avoid doing the same expensive TV build on both feature-branch push and PR events.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build TV debug APK
        working-directory: android-tv
        run: chmod +x ../android/gradlew && ../android/gradlew --no-daemon --console=plain --stacktrace --info --build-cache assembleDebug
      - name: Verify TV package and Leanback launcher
        working-directory: android-tv
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/xclone-tv-badging.txt
          grep -q "package: name='com.xclone.app.tv.debug'" /tmp/xclone-tv-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/xclone-tv-manifest.txt
          grep -q "android.intent.category.LEANBACK_LAUNCHER" /tmp/xclone-tv-manifest.txt
          grep -q "android.hardware.touchscreen" /tmp/xclone-tv-manifest.txt
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload XClone TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xclone-tv-debug-apk-${{ github.sha }}
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
