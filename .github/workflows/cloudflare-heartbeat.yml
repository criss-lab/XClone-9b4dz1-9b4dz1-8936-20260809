name: Cloudflare Heartbeat Edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/heartbeat-worker/**"
      - "supabase/functions/heartbeat/**"
      - "supabase/migrations/20260919082909_heartbeat_function_execute_hardening.sql"
      - "supabase/migrations/20260919093000_user_heartbeat_lease.sql"
      - "supabase/migrations/20260919093500_user_heartbeat_lease_window.sql"
      - "src/services/heartbeatClient.ts"
      - "supabase/migrations/20260919143000_economical_heartbeat.sql"
      - ".github/workflows/cloudflare-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-heartbeat
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy heartbeat edge
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions production secret CLOUDFLARE_API_TOKEN. Wrangler cannot authenticate without a Cloudflare API token."
            exit 1
          fi
          printf "::add-mask::%s\\n" "$CLOUDFLARE_API_TOKEN"
          echo "Cloudflare deployment credentials are present (values masked)."

      - name: Deploy and validate Cloudflare Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/heartbeat-worker
          wranglerVersion: "4.135.0"
          command: deploy

      - name: Validate active Worker deployment
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/heartbeat-worker
          wranglerVersion: "4.135.0"
          command: deployments status

      - name: Validate Worker source security invariants
        shell: bash
        run: |
          set -euo pipefail
          worker="cloudflare/heartbeat-worker/src/index.ts"
          grep -Fq '"https://testagram.site"' "$worker"
          grep -Fq '"https://www.testagram.site"' "$worker"
          grep -Fq 'authorization' "$worker"
          grep -Fq 'apikey' "$worker"
          grep -Fq 'SUPABASE_HEARTBEAT_RPC_URL' "cloudflare/heartbeat-worker/wrangler.toml"
          grep -Fq 'SUPABASE_PUBLISHABLE_KEY' "cloudflare/heartbeat-worker/wrangler.toml"
          grep -Fq 'Authentication required' "$worker"
          grep -Fq 'cache-control' "$worker"
          client="src/services/heartbeatClient.ts"
          migration="supabase/migrations/20260919143000_economical_heartbeat.sql"
          grep -Fq 'ACTIVE_WINDOW_MS' "$client"
          grep -Fq 'HEARTBEAT_INTERVAL_MS = 30 * 60_000' "$client"
          grep -Fq 'onAuthStateChange' "$client"
          grep -Fq 'pointerdown' "$client"
          grep -Fq 'scroll' "$client"
          grep -Fq '45 minutes' "$migration"
          grep -Fq '30 minutes' "$migration"
          if grep -Fq 'setInterval' "$client"; then
            echo "::error::Heartbeat client must not use a fixed background interval."
            exit 1
          fi
          echo "Heartbeat Worker and client contain the authenticated boundary, direct Supabase RPC path, activity gating, and economical scheduling."

      - name: Validate live Worker authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl -sS --connect-timeout 10 --max-time 30             -D "$headers" -o "$body" -w "%{http_code}"             -X POST "https://heartbeat.testagram.site"             -H "Content-Type: application/json"             --data '{}')"

          if [[ "$status" == "401" ]] && grep -qi '^x-testagram-heartbeat: cloudflare-edge' "$headers"; then
            echo "Live heartbeat Worker is reachable and rejects unauthenticated heartbeats as expected."
            exit 0
          fi

          if [[ "$status" == "429" ]] && grep -q 'error code: 1027' "$body"; then
            echo "::warning::Cloudflare returned Error 1027 before the Worker executed. This is the Workers Free daily request ceiling, not an application authentication failure; the deployment itself and the Supabase authentication boundary are validated separately."
            exit 0
          fi

          echo "::error::Heartbeat Worker live endpoint returned HTTP $status; expected a Worker-generated 401 or an explicit Cloudflare 1027 quota response."
          cat "$body"
          cat "$headers"
          exit 1

      - name: Validate live Supabase heartbeat authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 10 --max-time 30             -o /tmp/supabase-heartbeat-body -w "%{http_code}"             -X POST "https://ffrhglgkukgsuhxenena.supabase.co/functions/v1/heartbeat"             -H "Content-Type: application/json"             --data '{}')"
          if [[ "$status" != "401" ]]; then
            echo "::error::Supabase heartbeat function returned HTTP $status without a user JWT; expected 401."
            cat /tmp/supabase-heartbeat-body
            exit 1
          fi
          echo "Supabase heartbeat function rejects unauthenticated calls as expected."

      - name: Emit non-secret deployment receipt
        if: ${{ success() }}
        run: echo "Cloudflare heartbeat Worker deployment and Supabase authentication boundary checks completed; Cloudflare 1027 quota exhaustion is reported as an external platform warning when present."
