# Testagram-owned identity engine deployment
name: Deploy Identity Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/identity-signup/**'
      - 'supabase/functions/identity-verification/**'
      - 'supabase/functions/identity-engine-result/**'
      - 'supabase/functions/identity-engine-worker/**'
      - 'supabase/migrations/**identity_engine.sql'
      - 'supabase/migrations/**kyc_engine_*.sql'
      - 'supabase/migrations/**kyc_*.sql'
      - '.github/workflows/deploy-identity-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-identity-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Testagram identity engine functions
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ffrhglgkukgsuhxenena
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test "${SUPABASE_PROJECT_ID}" = "ffrhglgkukgsuhxenena"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Verify and bootstrap identity engine secrets
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(supabase secrets list --project-ref "${SUPABASE_PROJECT_ID}")"
          printf '%s\n' "$secrets"
          printf '%s\n' "$secrets" | grep -Eq "(^|[[:space:]|])IDENTITY_PREAUTH_SECRET([[:space:]|]|$)" || {
            echo "::error::IDENTITY_PREAUTH_SECRET is not configured in Supabase project secrets."
            exit 1
          }
          if ! printf '%s\n' "$secrets" | grep -Eq "(^|[[:space:]|])IDENTITY_ENGINE_SECRET([[:space:]|]|$)"; then
            engine_secret="$(openssl rand -hex 32)"
            supabase secrets set "IDENTITY_ENGINE_SECRET=$engine_secret" --project-ref "${SUPABASE_PROJECT_ID}" >/dev/null
            unset engine_secret
            echo "Bootstrapped missing IDENTITY_ENGINE_SECRET in Supabase; value was never printed or committed."
          fi
          secrets_after="$(supabase secrets list --project-ref "${SUPABASE_PROJECT_ID}")"
          printf '%s\n' "$secrets_after" | grep -Eq "(^|[[:space:]|])IDENTITY_ENGINE_SECRET([[:space:]|]|$)" || {
            echo "::error::IDENTITY_ENGINE_SECRET could not be verified after bootstrap."
            exit 1
          }
          echo "Identity engine secrets are configured. Mail-service configuration is intentionally a separate deployment gate."

      - name: Deploy identity functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy identity-signup --project-ref "${SUPABASE_PROJECT_ID}" --no-verify-jwt
          supabase functions deploy identity-verification --project-ref "${SUPABASE_PROJECT_ID}" --no-verify-jwt
          supabase functions deploy identity-engine-result --project-ref "${SUPABASE_PROJECT_ID}" --no-verify-jwt
          supabase functions deploy identity-engine-worker --project-ref "${SUPABASE_PROJECT_ID}" --no-verify-jwt

      - name: Verify deployed functions exist
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "${SUPABASE_PROJECT_ID}"
