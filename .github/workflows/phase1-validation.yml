name: Phase 1 Validation

on:
  push:
    branches: [main, phase1-production-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: ''
  NPM_CONFIG_NODE_OPTIONS: ''

concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Node environment
        run: |
          node --version
          npm --version
          test -z "${NODE_OPTIONS:-}"
          test -z "${NPM_CONFIG_NODE_OPTIONS:-}"
      - name: Disable host-specific npm preload for CI install
        run: |
          if grep -q '^node-options=' .npmrc; then
            cp .npmrc .npmrc.ci-backup
            sed -i '/^node-options=/d' .npmrc
          fi
          test "$(npm config get node-options)" = ""
          ! grep -q '^node-options=' .npmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Restore project npm configuration
        if: always()
        run: |
          if [ -f .npmrc.ci-backup ]; then
            mv .npmrc.ci-backup .npmrc
          fi
      - run: npm run lint
      - run: npm run build

  android:
    name: Android debug regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Run unit tests
        working-directory: android
        run: ./gradlew test --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xclone-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
