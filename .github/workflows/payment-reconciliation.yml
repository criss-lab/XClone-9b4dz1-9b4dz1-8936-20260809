name: Payment Reconciliation

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run reconciliation worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RECONCILIATION_SECRET: ${{ secrets.PAYMENT_RECONCILIATION_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$RECONCILIATION_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/payment-reconciliation" \
            -H 'Content-Type: application/json' \
            -H "x-reconciliation-secret: $RECONCILIATION_SECRET" \
            --data '{}'
