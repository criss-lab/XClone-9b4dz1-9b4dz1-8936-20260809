name: Temporary Flutter formatter diagnostic
on:
  pull_request:
    paths:
      - mobile/lib/features/profile/profile_page.dart
      - .github/workflows/format-profile-diff.yml
permissions:
  contents: read
jobs:
  formatter-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Print Dart formatter diff
        run: |
          cd mobile
          dart format lib/features/profile/profile_page.dart
          git diff -- mobile/lib/features/profile/profile_page.dart
