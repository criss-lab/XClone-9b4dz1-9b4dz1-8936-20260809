name: Testagram Virtual CDN Integration Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-cdn-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/testagram-cdn/go.mod
          cache-dependency-path: services/testagram-cdn/go.sum
      - name: Verify browser virtual CDN contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const CACHE_NAME = 'testagram-virtual-cdn-v1'" src/services/virtualCdnLoader.ts
          grep -F 'const LIVE_SEGMENT_TTL_MS = 20_000' src/services/virtualCdnLoader.ts
          grep -F 'const MAX_CACHED_SEGMENTS = 180' src/services/virtualCdnLoader.ts
          grep -F "import { fetchVirtualPeerSegment } from '@/services/virtualCdnPeers'" src/services/virtualCdnLoader.ts
          grep -F 'const MAX_PEERS = 3' src/services/virtualCdnPeers.ts
          grep -F 'const MAX_SEGMENT_BYTES = 1_500_000' src/services/virtualCdnPeers.ts
          grep -F 'const PEER_REQUEST_TIMEOUT_MS = 1_000' src/services/virtualCdnPeers.ts
          grep -F 'const SIGNALING_COHORTS = 65_536' src/services/virtualCdnPeers.ts
          grep -F "recordVirtualCdnMetric('peerHit')" src/services/virtualCdnPeers.ts
          grep -F "recordVirtualCdnMetric('originBytes', bytes.byteLength)" src/services/virtualCdnLoader.ts
          grep -F "recordVirtualCdnMetric('cacheBytes', result.bytes.byteLength)" src/services/virtualCdnLoader.ts
          grep -F 'clientOffloadByteShare' src/services/virtualCdnMetrics.ts
          grep -F "recordVirtualCdnMetric('playbackStall')" src/components/features/TvChannelPlayer.tsx
          grep -F 'data.byteLength > CHUNK_BYTES' src/services/virtualCdnPeers.ts
          grep -F 'export function getVirtualCdnMetrics()' src/services/virtualCdnMetrics.ts
          grep -F 'export function estimateVirtualCdnCapacity' src/services/virtualCdnCapacity.ts
          grep -F 'estimatedSignalingConnections: optedInViewers * channels' src/services/virtualCdnCapacity.ts
          grep -F 'estimatedOriginGbps: estimatedOriginMbps / 1000' src/services/virtualCdnCapacity.ts
          grep -F "['failed', 'closed'].includes(pc.connectionState)" src/services/virtualCdnPeers.ts
          grep -F "localStorage.getItem('testagram-tv-peer-sharing') === 'on'" src/services/virtualCdnPeers.ts
          grep -F "if (url.username || url.password || sensitiveUrl(value)) return false;" src/services/virtualCdnPeers.ts
          grep -F "import {closeVirtualPeerRooms} from '@/services/virtualCdnPeers';" src/components/features/TvChannelPlayer.tsx
          grep -F "Peer share" src/components/features/TvChannelPlayer.tsx
          grep -F "const candidates = [...this.channels.entries()].filter(([peerId, dc]) => dc.readyState === 'open' && !this.requestingPeers.has(peerId)).slice(0, MAX_PEERS);" src/services/virtualCdnPeers.ts
          grep -F 'if (!cached || !cached.originVerified || cached.bytes.byteLength < 1 || cached.bytes.byteLength > MAX_SEGMENT_BYTES)' src/services/virtualCdnPeers.ts
          grep -F 'const [firstHash, secondHash] = await Promise.all([digest(responses[0].bytes), digest(responses[1].bytes)]);' src/services/virtualCdnPeers.ts
          grep -F "const response = await fetch(url, { method: 'GET', headers, credentials: 'same-origin', signal: controller.signal });" src/services/virtualCdnLoader.ts
          grep -F "import VirtualCdnLoader from '@/services/virtualCdnLoader'" src/components/features/TvChannelPlayer.tsx
          grep -F 'loader:VirtualCdnLoader as any' src/components/features/TvChannelPlayer.tsx
          grep -F 'const playbackUrl=proxyFallbackRef.current?proxyUrl():directUrl;' src/components/features/TvChannelPlayer.tsx
          if grep -F 'tv-cdn-playback' src/components/features/TvChannelPlayer.tsx; then
            echo 'TV playback must not call a hosted CDN authorization function.' >&2
            exit 1
          fi
          if grep -F 'runs-on: [self-hosted' .github/workflows/deploy-testagram-cdn.yml; then
            echo 'A self-hosted CDN deployment must not be required.' >&2
            exit 1
          fi
      - name: Test virtual CDN capacity math
        run: node --experimental-strip-types --test scripts/virtual-cdn-capacity.test.mjs
      - name: Run loopback staged load and peer-outage fallback simulation
        run: node scripts/virtual-cdn-staged-load.mjs
      - name: Test legacy Go code without deployment
        working-directory: services/testagram-cdn
        run: go test ./...
      - name: Build XClone
        run: |
          npm ci
          npm run build
