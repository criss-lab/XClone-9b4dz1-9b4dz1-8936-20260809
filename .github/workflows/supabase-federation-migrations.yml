name: Testagram Supabase Federation Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-federation-migrations.yml'

permissions:
  contents: read

concurrency:
  group: testagram-supabase-federation-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_REF: aepbqfrmheihfsauzcby
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate Supabase access
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          case "$SUPABASE_ACCESS_TOKEN" in sbp_*) ;; *) echo 'Invalid Supabase access token format.'; exit 1;; esac
      - name: Install Supabase CLI
        run: npm install --global supabase@latest
      - name: Push database migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes
