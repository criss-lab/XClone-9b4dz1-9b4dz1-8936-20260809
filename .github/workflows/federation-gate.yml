name: Federation Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/federation-gate.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/federation-gate.yml'

permissions:
  contents: read

concurrency:
  group: federation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    name: Deno federation compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify checked-out revision
        run: git rev-parse HEAD
      - name: Typecheck federation entrypoints
        run: |
          deno check --node-modules-dir=none supabase/functions/mastodon-federation/index.ts
          deno check --node-modules-dir=none supabase/functions/mastodon-api/index.ts
          deno check --node-modules-dir=none supabase/functions/megalodon-gateway/index.ts
          deno check --node-modules-dir=none supabase/functions/federated-feed/index.ts
          deno check --node-modules-dir=none supabase/functions/federated-discovery-feed/index.ts
          deno check --node-modules-dir=none supabase/functions/mastodon-edge/index.ts
          deno check --node-modules-dir=none supabase/functions/federation-inbox/index.ts
          deno check --node-modules-dir=none supabase/functions/federation-transport/index.ts
          deno check --node-modules-dir=none supabase/functions/_shared/activitypub-conformance.ts
          deno check --node-modules-dir=none supabase/functions/_shared/activitypub-security.ts
          deno check --node-modules-dir=none supabase/functions/_shared/activitypub-delivery.ts
          deno check --node-modules-dir=none supabase/functions/_shared/activitypub-compat.ts
          deno check --node-modules-dir=none supabase/functions/_shared/federation-security.ts
      - name: Run conformance tests
        run: deno test --node-modules-dir=none supabase/functions/_shared/activitypub-conformance.test.ts
