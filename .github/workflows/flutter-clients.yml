name: Flutter Web and Android parity gates

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'docs/flutter-migration-plan.md'
      - 'docs/flutter-parity-inventory.json'
      - 'docs/flutter-route-parity.json'
      - 'docs/mobile-architecture.md'
      - 'scripts/update-flutter-route-parity.mjs'
      - 'scripts/update-flutter-parity-inventory.mjs'
      - 'scripts/validate-flutter-parity-inventory.mjs'
      - '.github/workflows/flutter-clients.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'docs/flutter-migration-plan.md'
      - 'docs/flutter-parity-inventory.json'
      - 'docs/flutter-route-parity.json'
      - 'scripts/update-flutter-route-parity.mjs'
      - 'docs/mobile-architecture.md'
      - 'scripts/update-flutter-parity-inventory.mjs'
      - 'scripts/validate-flutter-parity-inventory.mjs'
      - '.github/workflows/flutter-clients.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Verify no existing source surfaces are omitted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-flutter-parity-inventory.mjs
      - name: Regenerate and verify Flutter route parity
        run: |
          node scripts/update-flutter-route-parity.mjs
          node -e "const d = JSON.parse(require('node:fs').readFileSync('docs/flutter-route-parity.json', 'utf8')); if (d.routes.length < 200 || d.counts.legacy_web_fallbacks < 1) process.exit(1); console.log(JSON.stringify(d.counts));"
          git diff --exit-code -- docs/flutter-route-parity.json

  flutter:
    name: Analyze, test and build both targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Print formatter diff diagnostic (temporary)
        working-directory: mobile
        run: |
          dart format lib/features/profile/profile_page.dart
          git diff -- mobile/lib/features/profile/profile_page.dart
      - name: Enforce formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Run widget and session policy tests
        working-directory: mobile
        run: flutter test --coverage
      - name: Build Flutter Web preview
        working-directory: mobile
        env:
          SUPABASE_URL: ${{ vars.TESTAGRAM_SUPABASE_URL || 'https://ffrhglgkukgsuhxenena.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.TESTAGRAM_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_h51Z3EHP2LN5o7HdRAB3Og_uhUA3oya' }}
        run: >-
          flutter build web --release --no-wasm-dry-run
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=TESTAGRAM_SITE_URL=https://testagram.site
      - name: Build native Android debug APK
        working-directory: mobile
        env:
          SUPABASE_URL: ${{ vars.TESTAGRAM_SUPABASE_URL || 'https://ffrhglgkukgsuhxenena.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.TESTAGRAM_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_h51Z3EHP2LN5o7HdRAB3Og_uhUA3oya' }}
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=TESTAGRAM_SITE_URL=https://testagram.site
      - name: Verify artifacts and package identity
        working-directory: mobile
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/app/outputs/flutter-apk/app-debug.apk
          grep -q 'applicationId = "com.xclone.app"' android/app/build.gradle.kts
          echo 'Flutter Web and Android debug artifacts exist; Android package identity is preserved.'
      - name: Upload Flutter Web preview (not production deployment)
        uses: actions/upload-artifact@v4
        with:
          name: testagram-flutter-web-${{ github.sha }}
          path: mobile/build/web/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Flutter Android debug APK (not a production release)
        uses: actions/upload-artifact@v4
        with:
          name: testagram-flutter-android-debug-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
