name: Testagram Fediverse Gate A Live
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fediverse-gate-a-live.yml'
      - 'supabase/functions/gateway-relay/index.ts'
      - 'supabase/migrations/*federation*'
      - 'cloudflare/worker/public-actor-entrypoint.ts'
      - 'cloudflare/worker/federation-interop-entrypoint.ts'
      - 'cloudflare/worker/production-entrypoint.ts'
permissions:
  contents: read
jobs:
  gate-a-live:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Validate and test full federation chain
        env:
          SUPABASE_URL: https://aepbqfrmheihfsauzcby.supabase.co
          GATEWAY_URL: https://aepbqfrmheihfsauzcby.supabase.co/functions/v1/gateway-relay
          FEDERATION_ORIGIN: https://federation.testagram.site
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}"
          test -n "$PUBLISHABLE_KEY"
          test -n "$SUPABASE_SECRET_KEY"
          RUN="${GITHUB_RUN_ID}-${RANDOM}"
          EMAIL="fediverse-live-${RUN}@example.invalid"
          PASS="TgLive-${RUN}-X9!"
          USER_ID=""
          trap 'test -z "$USER_ID" || curl -sS -o /dev/null -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$USER_ID" -H "apikey: $SUPABASE_SECRET_KEY" || true' EXIT
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/auth/v1/admin/users" -H "apikey: $SUPABASE_SECRET_KEY" -H 'Content-Type: application/json' -d "$(jq -nc --arg e "$EMAIL" --arg p "$PASS" '{email:$e,password:$p,email_confirm:true}')" >/tmp/user.json
          USER_ID="$(jq -r '.id' /tmp/user.json)"
          TOKEN="$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $PUBLISHABLE_KEY" -H 'Content-Type: application/json' -d "$(jq -nc --arg e "$EMAIL" --arg p "$PASS" '{email:$e,password:$p}')" | jq -r '.access_token')"
          test -n "$USER_ID"; test -n "$TOKEN"
          PROFILE_STATUS="$(curl -sS -o /tmp/profile.json -w '%{http_code}' --max-time 20 "$SUPABASE_URL/rest/v1/profiles?id=eq.$USER_ID&select=username" -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" || true)"
          echo "Profile HTTP status: $PROFILE_STATUS"; cat /tmp/profile.json || true
          test "$PROFILE_STATUS" = 200
          PROFILE_USERNAME="$(jq -er '.[0].username' /tmp/profile.json)"
          EXPECTED_ACTOR="$FEDERATION_ORIGIN/users/$PROFILE_USERNAME"
          echo "Canonical profile username: $PROFILE_USERNAME"
          echo "Expected actor: $EXPECTED_ACTOR"

          echo 'Bootstrapping authenticated federation actor before any remote delivery...'
          BOOTSTRAP_STATUS="$(curl -sS -o /tmp/bootstrap.json -w '%{http_code}' --max-time 20 -X POST "$GATEWAY_URL" -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"path":"/timeline/federated","body":{}}')"
          echo "Bootstrap HTTP status: $BOOTSTRAP_STATUS"; cat /tmp/bootstrap.json
          test "$BOOTSTRAP_STATUS" = 200
          ACTOR_QUERY_STATUS="$(curl -sS -o /tmp/actor-query.json -w '%{http_code}' --max-time 20 "$SUPABASE_URL/rest/v1/federation_actors?user_id=eq.$USER_ID&select=actor_url" -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY")"
          echo "Actor REST HTTP status: $ACTOR_QUERY_STATUS"; cat /tmp/actor-query.json
          test "$ACTOR_QUERY_STATUS" = 200
          LOCAL_ACTOR="$(jq -er '.[0].actor_url' /tmp/actor-query.json)"
          test "$LOCAL_ACTOR" = "$EXPECTED_ACTOR"

          echo 'Waiting for the canonical public actor endpoint to serve the durable actor before asking Mastodon to fetch it...'
          ACTOR_STATUS=""
          for attempt in $(seq 1 12); do
            ACTOR_STATUS="$(curl -sS -o /tmp/actor.json -w '%{http_code}' --max-time 20 -H 'Accept: application/activity+json' -H 'Cache-Control: no-cache' -H 'User-Agent: Testagram-Federation-Gate/1.0' "$LOCAL_ACTOR" || true)"
            echo "Preflight actor HTTP status attempt $attempt: $ACTOR_STATUS"
            cat /tmp/actor.json || true
            if [ "$ACTOR_STATUS" = 200 ] && jq -e --arg actor "$LOCAL_ACTOR" --arg key "${LOCAL_ACTOR}#main-key" '(.id == $actor) and (.type == "Person") and (.inbox == ($actor + "/inbox")) and (.publicKey.id == $key) and (.publicKey.owner == $actor) and ((.publicKey.publicKeyPem // "") | length > 100)' /tmp/actor.json >/dev/null 2>&1; then
              echo 'Canonical actor preflight passed.'
              break
            fi
            sleep 5
          done
          test "$ACTOR_STATUS" = 200

          STATUS="$(curl -sS -o /tmp/follow.json -w '%{http_code}' --max-time 60 -X POST "$GATEWAY_URL" -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$(jq -nc '{path:"/follow",body:{target:"@Mastodon@mastodon.social"}}')")"
          echo "Follow HTTP status: $STATUS"; cat /tmp/follow.json
          test "$STATUS" = 200
          LOCAL_ACTOR="$(jq -er '.activity.actor' /tmp/follow.json)"
          ACTIVITY_ID="$(jq -er '.activityId' /tmp/follow.json)"
          REMOTE_ACTOR="$(jq -er '.activity.object' /tmp/follow.json)"
          echo "Local actor: $LOCAL_ACTOR"
          test "$LOCAL_ACTOR" = "$EXPECTED_ACTOR"
          echo 'Probing WebFinger and actor endpoints before actor assertion...'
          WF_STATUS="$(curl -sS -D /tmp/webfinger-headers.txt -o /tmp/webfinger.json -w '%{http_code}' --max-time 20 -H 'Accept: application/jrd+json, application/json' -H 'Cache-Control: no-cache' -H 'User-Agent: Testagram-Federation-Gate/1.0' "${FEDERATION_ORIGIN}/.well-known/webfinger?resource=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "acct:${PROFILE_USERNAME}@federation.testagram.site")" || true)"
          echo "WebFinger HTTP status: $WF_STATUS"; cat /tmp/webfinger.json || true
          ACTOR_STATUS=""
          for attempt in $(seq 1 12); do
            ACTOR_STATUS="$(curl -sS -D /tmp/actor-headers.txt -o /tmp/actor.json -w '%{http_code}' --max-time 20 -H 'Accept: application/activity+json' -H 'Cache-Control: no-cache' -H 'User-Agent: Testagram-Federation-Gate/1.0' "$LOCAL_ACTOR" || true)"
            echo "Local actor HTTP status attempt $attempt: $ACTOR_STATUS"
            echo 'Actor response headers:'; cat /tmp/actor-headers.txt || true
            echo 'Actor response body:'; cat /tmp/actor.json || true
            if [ "$ACTOR_STATUS" = 200 ] && jq -e --arg actor "$LOCAL_ACTOR" --arg key "${LOCAL_ACTOR}#main-key" '(.id == $actor) and (.type == "Person") and (.preferredUsername | length > 0) and (.inbox == ($actor + "/inbox")) and (.publicKey.id == $key) and (.publicKey.owner == $actor) and ((.publicKey.publicKeyPem // "") | length > 100)' /tmp/actor.json >/dev/null 2>&1; then
              echo 'Public actor schema assertion passed.'
              break
            fi
            sleep 5
          done
          test "$WF_STATUS" = 200
          jq -e --arg actor "$LOCAL_ACTOR" '(.aliases | index($actor) != null) and (.links | any(.[]; .href == $actor and .rel == "self"))' /tmp/webfinger.json
          test "$ACTOR_STATUS" = 200
          jq -e --arg actor "$LOCAL_ACTOR" --arg key "${LOCAL_ACTOR}#main-key" '(.id == $actor) and (.type == "Person") and (.preferredUsername | length > 0) and (.inbox == ($actor + "/inbox")) and (.publicKey.id == $key) and (.publicKey.owner == $actor) and ((.publicKey.publicKeyPem // "") | length > 100)' /tmp/actor.json
          curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/federation_outbox?activity_id=eq.$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$ACTIVITY_ID")&select=activity_type,status,attempts,http_status" -H "apikey: $SUPABASE_SECRET_KEY" >/tmp/outbox.json
          jq -e 'length == 1 and .[0].activity_type == "Follow" and .[0].attempts == 1 and (.[0].status == "delivered" or .[0].status == "pending")' /tmp/outbox.json
          ACCEPT_FOUND=0
          for i in $(seq 1 24); do
            curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/federation_inbox?activity_type=eq.Accept&order=received_at.desc&limit=50&select=activity_id,activity_type,actor_url,payload,received_at,processing_status" -H "apikey: $SUPABASE_SECRET_KEY" >/tmp/accepts.json
            if jq -e --arg fid "$ACTIVITY_ID" --arg remote "$REMOTE_ACTOR" 'any(.[]; .activity_type == "Accept" and .actor_url == $remote and ((.payload.object.id? // .payload.object?) == $fid) and (.payload.actor? == $remote))' /tmp/accepts.json >/dev/null; then ACCEPT_FOUND=1; break; fi
            sleep 5
          done
          test "$ACCEPT_FOUND" = 1
          REMOTE_ESC="$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$REMOTE_ACTOR")"
          curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/federation_relationships?user_id=eq.$USER_ID&remote_actor_url=eq.$REMOTE_ESC&select=relationship,activity_id,updated_at,last_error" -H "apikey: $SUPABASE_SECRET_KEY" >/tmp/relationship.json
          cat /tmp/relationship.json
          jq -e 'length == 1 and .[0].relationship == "accepted" and .[0].activity_id == $fid' --arg fid "$ACTIVITY_ID" /tmp/relationship.json
          echo 'PASS: worldwide actor discovery -> signed Follow -> Mastodon delivery -> outbox -> Accept -> accepted relationship'
