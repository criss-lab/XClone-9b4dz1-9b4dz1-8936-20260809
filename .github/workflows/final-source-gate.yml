name: Final Source Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '_build.cjs'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-source-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact main revision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.sha }}"
          test "$actual" = "$expected"
          echo "Verified source SHA: $actual"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify build output exists
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html
          echo "Build verified for source SHA: ${{ github.sha }}"
