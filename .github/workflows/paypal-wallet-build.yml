name: PayPal Wallet Build Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker/paypal.ts'
      - 'cloudflare/worker/production-entrypoint.ts'
      - 'cloudflare/wrangler.jsonc'
      - 'supabase/migrations/**paypal**'
      - '.github/workflows/paypal-wallet-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate source wiring
        run: |
          set -euo pipefail
          test -s cloudflare/worker/paypal.ts
          test -s cloudflare/worker/production-entrypoint.ts
          grep -Fq 'zcjtvykwwplnzyyslnop.supabase.co' cloudflare/wrangler.jsonc
          grep -Fq 'handlePayPal' cloudflare/worker/production-entrypoint.ts
          grep -Fq 'finalize_paypal_topup' cloudflare/worker/paypal.ts
      - name: Build Worker with Wrangler dry-run
        run: |
          set -euo pipefail
          rm -rf /tmp/paypal-worker-build
          npx --yes wrangler@4.126.0 deploy --config cloudflare/wrangler.jsonc --dry-run --outdir /tmp/paypal-worker-build
          bundle="$(find /tmp/paypal-worker-build -type f -name '*.js' -print -quit)"
          test -n "$bundle"
          test -s "$bundle"
          printf 'bundle=%s\n' "$bundle"
          wc -c "$bundle"
          printf '%s\n' "$bundle" > /tmp/paypal-bundle-path
      - name: Inspect generated bundle
        run: |
          set -euo pipefail
          bundle="$(cat /tmp/paypal-bundle-path)"
          grep -Fq '/api/paypal' "$bundle"
          grep -Fq 'finalize_paypal_topup' "$bundle"
          grep -Fq 'PAYPAL_CLIENT_ID' "$bundle"
      - name: Validate migration is present
        run: |
          set -euo pipefail
          test -n "$(find supabase/migrations -maxdepth 1 -type f -iname '*paypal*' -print -quit)"
