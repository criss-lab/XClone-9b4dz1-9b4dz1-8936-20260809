name: Historical Production Signing Key Forensics

on:
  push:
    branches:
      - forensic/historical-signing-key-scan
  workflow_dispatch:
    inputs:
      reference_fingerprint:
        description: "SHA-256 fingerprint of the known-good production APK certificate"
        required: true
        default: "E7:17:82:7E:F5:85:3D:0C:EF:A0:4B:35:77:09:CC:9C:80:FC:F1:5F:7C:D6:75:55:A1:BD:A0:75:13:A6:AC:9"

permissions:
  contents: read

jobs:
  historical-signing-key-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare historical keystore candidates
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REFERENCE_FINGERPRINT: ${{ inputs.reference_fingerprint }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured."
            exit 1
          }

          normalize() {
            printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]'
          }

          TARGET="$(normalize "${REFERENCE_FINGERPRINT}")"
          found=0
          match=0

          mapfile -t BLOBS < <(
            git rev-list --objects --all |
              awk '$2 == "keystore-base64.txt" {print $1}' |
              sort -u
          )

          if [ "${#BLOBS[@]}" -eq 0 ]; then
            echo "::error::No historical keystore-base64.txt blobs were found."
            exit 2
          fi

          mkdir -p /tmp/keystore-forensics

          for BLOB in "${BLOBS[@]}"; do
            found=$((found + 1))
            B64="/tmp/keystore-forensics/${BLOB}.b64"
            JKS="/tmp/keystore-forensics/${BLOB}.jks"

            git cat-file blob "${BLOB}" > "${B64}"

            if ! tr -d '\r\n ' < "${B64}" | base64 --decode > "${JKS}" 2>/dev/null; then
              echo "CANDIDATE ${BLOB}: invalid Base64"
              rm -f "${B64}" "${JKS}"
              continue
            fi

            if ! keytool -list -v -keystore "${JKS}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" > "${JKS}.txt" 2>/dev/null; then
              echo "CANDIDATE ${BLOB}: PASSWORD MISMATCH with current ANDROID_KEYSTORE_PASSWORD"
              rm -f "${B64}" "${JKS}" "${JKS}.txt"
              continue
            fi

            CERT="$(awk -F': ' '/SHA256:/{print $2; exit}' "${JKS}.txt" | tr -d '[:space:]')"
            ALIAS="$(awk -F': ' '/Alias name:/{print $2; exit}' "${JKS}.txt" | tr -d '[:space:]')"
            NORMAL_CERT="$(normalize "${CERT}")"

            echo "CANDIDATE ${BLOB}: alias=${ALIAS:-unknown} certificate=${CERT:-unavailable}"

            if [ -n "${NORMAL_CERT}" ] && [ "${NORMAL_CERT}" = "${TARGET}" ]; then
              echo "::notice::MATCH — historical candidate ${BLOB} is the signing identity of the known-good production APK."
              match=$((match + 1))
            fi

            rm -f "${B64}" "${JKS}" "${JKS}.txt"
          done

          echo "Historical candidates examined: ${found}"
          echo "Production-identity matches: ${match}"

          if [ "${match}" -eq 1 ]; then
            echo "MATCH FOUND — do not rotate the production signing identity."
            exit 0
          fi

          if [ "${match}" -gt 1 ]; then
            echo "::error::Multiple historical candidates matched the production certificate; investigate before changing any secret."
            exit 3
          fi

          echo "::error::No historical keystore candidate matched the production certificate using the configured keystore password."
          exit 4

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/keystore-forensics
