name: Cloudflare CDN Build Gate (no IPTV media route)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/cdn-worker/**"
      - ".github/workflows/cloudflare-cdn.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/cdn-worker/**"
      - ".github/workflows/cloudflare-cdn.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-cdn-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Build Worker and reject IPTV media ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci
      - name: Build-only Worker validation
        run: npx wrangler deploy --dry-run --config cloudflare/cdn-worker/wrangler.toml
      - name: Verify canonical route boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'name = "testagram-cdn"' cloudflare/cdn-worker/wrangler.toml
          grep -Fq 'pattern = "cdn.testagram.site"' cloudflare/cdn-worker/wrangler.toml
          if grep -Fq 'pattern = "media.testagram.site/*"' cloudflare/cdn-worker/wrangler.toml; then
            echo "::error::Cloudflare must not own media.testagram.site; IPTV playback uses original sources and browser virtual caching."
            exit 1
          fi
          grep -Fq 'MEDIA_BUCKET' cloudflare/cdn-worker/src/index.ts
          grep -Fq 'x-testagram-cdn-version' cloudflare/cdn-worker/src/index.ts
