name: Cloudflare Testagram CDN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/cdn-worker/**"
      - ".github/workflows/cloudflare-cdn.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-cdn
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Testagram CDN
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          printf "::add-mask::%s\n" "$CLOUDFLARE_API_TOKEN"

      - name: Deploy CDN Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.135.0"
          command: deploy --config cloudflare/cdn-worker/wrangler.toml

      - name: Verify source invariants
        run: |
          set -euo pipefail
          grep -Fq 'cdn.testagram.site' cloudflare/cdn-worker/wrangler.toml
          grep -Fq 'media.testagram.site/*' cloudflare/cdn-worker/wrangler.toml
          grep -Fq 'MEDIA_BUCKET' cloudflare/cdn-worker/src/index.ts
          grep -Fq 'UPSTASH_REDIS_REST_URL' cloudflare/cdn-worker/src/index.ts
          grep -Fq "x-testagram-cdn" cloudflare/cdn-worker/src/index.ts

      - name: Reconcile Cloudflare routes and custom domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          ACCOUNT_ID="77dbe7a859196105dc84fbb6b7094019"
          ZONE_ID="$(curl -fsS "$API/zones?name=testagram.site&account.id=$ACCOUNT_ID&status=active" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')"
          test -n "$ZONE_ID" || { echo "::error::Unable to resolve testagram.site zone."; exit 1; }

          routes="$(curl -fsS "$API/zones/$ZONE_ID/workers/routes" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          mapfile -t conflicts < <(jq -r '.result[]? | select(.pattern == "cdn.testagram.site/*" or .pattern == "cdn.testagram.site") | .id' <<<"$routes")
          for route_id in "${conflicts[@]}"; do
            [[ -n "$route_id" ]] || continue
            response="$(curl -fsS -X DELETE "$API/zones/$ZONE_ID/workers/routes/$route_id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            jq -e '.success == true' <<<"$response" >/dev/null
          done

          response="$(curl -fsS "$API/accounts/$ACCOUNT_ID/workers/domains?hostname=cdn.testagram.site&service=testagram-cdn" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          jq -e '.success == true and (.result | length > 0)' <<<"$response" >/dev/null || {
            echo "::error::cdn.testagram.site is not attached to testagram-cdn."
            exit 1
          }
          routes="$(curl -fsS "$API/zones/$ZONE_ID/workers/routes" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          jq -e '.success == true and any(.result[]?; .pattern == "media.testagram.site/*" and .script == "testagram-cdn")' <<<"$routes" >/dev/null || {
            echo "::error::media.testagram.site/* is not routed to testagram-cdn."
            exit 1
          }
          echo "Cloudflare CDN custom-domain and media-route reconciliation passed."

      - name: Verify public CDN endpoints
        shell: bash
        run: |
          set -euo pipefail
          for host in cdn.testagram.site media.testagram.site; do
            ok=false
            for attempt in $(seq 1 18); do
              status="$(curl -ksS --connect-timeout 5 --max-time 15 -o /tmp/body -D /tmp/headers -w '%{http_code}' "https://$host/health" || true)"
              if [[ "$status" == "200" ]] && grep -qi '^x-testagram-cdn:' /tmp/headers; then
                echo "$host is live through Cloudflare CDN."
                ok=true
                break
              fi
              echo "Attempt $attempt: $host not ready (HTTP $status); waiting."
              sleep 10
            done
            [[ "$ok" == true ]] || { echo "::error::$host did not become a live CDN endpoint."; exit 1; }
          done
