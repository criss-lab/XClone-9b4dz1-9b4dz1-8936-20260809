name: IPTV TikVTV Ingestion Build
# Deterministic post-merge build gate for the pinned upstream.

on:
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'vendor/TikVTV'
      - 'src/App.tsx'
      - 'mobile/lib/app/testagram_app.dart'
      - 'mobile/lib/features/tv/**'
      - 'src/pages/TikVTVPage.tsx'
      - 'src/components/features/ExternalAdEngine.tsx'
      - 'scripts/validate-ad-slot-contract.mjs'
      - 'scripts/validate-iptv-prefetch.mjs'
      - 'package.json'
      - '_build.cjs'
      - '.github/workflows/iptv-tikvtv.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'vendor/TikVTV'
      - 'src/App.tsx'
      - 'src/pages/TikVTVPage.tsx'
      - 'src/components/features/ExternalAdEngine.tsx'
      - 'scripts/validate-ad-slot-contract.mjs'
      - 'scripts/validate-iptv-prefetch.mjs'
      - 'package.json'
      - '_build.cjs'
      - '.github/workflows/iptv-tikvtv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-tikvtv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Xclone + immutable TikVTV IPTV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with TikVTV submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned TikVTV commit
        run: |
          set -euo pipefail
          test -f vendor/TikVTV/package.json
          test "$(git -C vendor/TikVTV rev-parse HEAD)" = "410391f8aaae92b3644bfde08fff50fa4a6afc08"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Xclone dependencies (retry transient release-download failures)
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Dependency install attempt ${attempt}/3"
            if npm ci --no-audit --no-fund > /tmp/npm-ci-attempt.log 2>&1; then
              cat /tmp/npm-ci-attempt.log
              exit 0
            else
              status=$?
            fi
            cat /tmp/npm-ci-attempt.log
            if [ "${attempt}" -lt 3 ] && grep -Eqi 'statusCode: 50[234]|HTTP[^[:cntrl:]]*50[234]|ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENETUNREACH|socket hang up|network timeout' /tmp/npm-ci-attempt.log; then
              delay=$((attempt * 15))
              echo "Transient upstream/network failure detected (exit ${status}); retrying in ${delay}s." >&2
              sleep "${delay}"
              continue
            fi
            echo "Dependency installation failed without a retryable network error (exit ${status}), or all retries were exhausted." >&2
            exit "${status}"
          done
          exit 1

      - name: Validate ad creative lifecycle contracts
        run: npm run validate:ads

      - name: Validate IPTV preload and cache safety contract
        run: node scripts/validate-iptv-prefetch.mjs

      - name: Build Xclone and TikVTV
        run: npm run build

      - name: Verify IPTV bundle was ingested
        run: |
          set -euo pipefail
          test -s dist/iptv-app/entry.html
          test -d dist/iptv-app/assets
          test -n "$(find dist/iptv-app/assets -type f | head -n 1)"
