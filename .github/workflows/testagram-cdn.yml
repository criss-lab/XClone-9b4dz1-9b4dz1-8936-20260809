name: Testagram First-Party CDN

on:
  push:
    branches: [main]
    paths:
      - "services/testagram-cdn/**"
      - ".github/workflows/testagram-cdn.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/testagram-cdn/**"
      - ".github/workflows/testagram-cdn.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/testagram-cdn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/testagram-cdn/go.mod
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/...

  container:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: |
          set -euo pipefail
          docker build --pull -f services/testagram-cdn/Dockerfile services/testagram-cdn             -t testagram-cdn:ci
