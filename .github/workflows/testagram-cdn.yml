name: Virtual CDN Regression Checks (legacy Go code only)

on:
  push:
    branches: [main]
    paths:
      - "services/testagram-cdn/**"
      - "src/services/virtualCdnLoader.ts"
      - ".github/workflows/testagram-cdn.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/testagram-cdn/**"
      - "src/services/virtualCdnLoader.ts"
      - ".github/workflows/testagram-cdn.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/testagram-cdn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/testagram-cdn/go.mod
      - name: Test retained Go code (not deployed)
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build retained Go code (not deployed)
        run: go build ./cmd/...
