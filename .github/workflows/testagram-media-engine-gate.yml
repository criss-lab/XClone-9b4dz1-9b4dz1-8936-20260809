name: Testagram Media Engine Gate

on:
  push:
    branches: [main]
    paths:
      - "media-engine/**"
      - "src/lib/testagramMedia.ts"
      - "src/pages/TvStudioPage.tsx"
      - "src/pages/TvPublicLivePage.tsx"
      - "supabase/functions/testagram-media-token/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "media-engine/**"
      - "src/lib/testagramMedia.ts"
      - "src/pages/TvStudioPage.tsx"
      - "src/pages/TvPublicLivePage.tsx"
      - "supabase/functions/testagram-media-token/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: testagram-media-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: media-engine/go.sum
      - run: go mod download
      - run: go mod verify
      - run: go mod tidy
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
