name: TV Channel Health Monitor

on:
  push:
    paths:
      - '.github/workflows/tv-health-monitor.yml'
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # OIDC-authenticated monitor; redeploy function changes are validated by the next scheduled run.
  group: tv-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    name: Probe worldwide TV channels
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build worldwide TV catalogue
        run: node scripts/build-tv-catalog.mjs

      - name: Request GitHub OIDC token
        id: oidc
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          node <<'NODE'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=testagram-tv-health';
            const r = await fetch(url, {
              headers: { authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }
            });
            if (!r.ok) throw new Error('OIDC token request failed: HTTP ' + r.status + ' ' + await r.text());
            const data = await r.json();
            if (!data.value) throw new Error('OIDC token response did not contain value');
            require('fs').writeFileSync(process.env.GITHUB_OUTPUT, 'token=' + data.value + '\n');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Probe channels in batches
        env:
          SUPABASE_URL: https://ffrhglgkukgsuhxenena.supabase.co
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          node <<'NODE'
          (async () => {
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('public/tv/channels.json','utf8'));
          const channels=data.channels||[];
          const endpoint=process.env.SUPABASE_URL+'/functions/v1/tv-health';
          const token=process.env.GITHUB_OIDC_TOKEN;
          const batchSize=500;
          const maxPerRun=5000;
          const alwaysProbe=Math.min(1000, channels.length);
          const rotating=channels.slice(alwaysProbe).sort((a,b)=>String(a.id).localeCompare(String(b.id)));
          const runSlot=Math.floor(Date.now()/900000); // 15-minute schedule slot
          const rotatingPerRun=Math.min(maxPerRun-alwaysProbe, rotating.length);
          let selected=channels.slice(0,alwaysProbe);
          if(rotatingPerRun>0){
            const start=(runSlot*rotatingPerRun)%rotating.length;
            selected=selected.concat(
              rotating.slice(start,start+rotatingPerRun),
              start+rotatingPerRun>rotating.length ? rotating.slice(0,(start+rotatingPerRun)-rotating.length) : []
            );
          }
          console.log(JSON.stringify({catalog_channels:channels.length,selected_for_run:selected.length,always_probe:alwaysProbe,rotating_per_run:rotatingPerRun,run_slot:runSlot}));
          let checked=0;
          for(let i=0;i<selected.length;i+=batchSize){
            const batch=selected.slice(i,i+batchSize);
            const r=await fetch(endpoint,{
              method:'POST',
              headers:{
                'content-type':'application/json',
                'x-github-oidc-token':token
              },
              body:JSON.stringify({channels:batch,limit:batch.length})
            });
            if(!r.ok) throw new Error('tv-health batch '+i+' failed: HTTP '+r.status+' '+await r.text());
            const result=await r.json();
            checked+=result.checked||0;
            console.log(JSON.stringify({batch:i/batchSize+1,checked:result.checked,online:result.online,offline:result.offline}));
          }
          console.log('Total channels checked: '+checked);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
