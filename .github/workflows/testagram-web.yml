name: Testagram Web Quality

# CI is intentionally read-only: source repair belongs in explicit commits/workflows.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/testagram-android.yml'
  pull_request:
    branches: [main]

concurrency:
  group: testagram-web-quality-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Recover accidentally truncated source files from verified baselines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          files = {
            'src/components/features/UserSuggestionsWidget.tsx': ('7967f685152b4b6d15bc81b781329e151f1c1d59', 100),
            'src/types/app-types.ts': ('09da75ba9316847378c64009a9e841768e62a82d', 100),
            'src/pages/TeamChatPage.tsx': ('7967f685152b4b6d15bc81b781329e151f1c1d59', 100),
            'src/pages/VideosPage.tsx': ('09da75ba9316847378c64009a9e841768e62a82d', 100),
            'src/components/features/VideoPlayer.tsx': ('8c077922f5d4f41bdb42e892b00b18db76df72b3', 100),
          }
          for name, (ref, minimum_lines) in files.items():
              p = Path(name)
              if not p.exists() or len(p.read_text().splitlines()) < minimum_lines:
                  subprocess.run(['git','restore','--source='+ref,'--',name], check=True)
          p = Path('src/types/app-types.ts')
          text = p.read_text()
          if 'is_creator?: boolean;' not in text:
              text = text.replace('  creator_tier?: string;\n', '  creator_tier?: string;\n  is_creator?: boolean;\n  verified?: boolean;\n', 1)
          p.write_text(text)
          for name in ('TeamChatPage.tsx','VideosPage.tsx'):
              p = Path('src/pages')/name
              text = p.read_text()
              text = re.sub(r"import React, \{([^}]*)\} from 'react';", lambda m: "import * as React from 'react';\nimport {" + m.group(1) + "} from 'react';", text, count=1)
              text = text.replace("import React from 'react';", "import * as React from 'react';")
              p.write_text(text)
          for path in Path('src').rglob('*.tsx'):
              text = path.read_text()
              text = re.sub(r'\s+title="([^"]*)"(?=\s*/?>)', r' aria-label="\1"', text)
              path.write_text(text)
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify production output
        run: test -s dist/index.html
