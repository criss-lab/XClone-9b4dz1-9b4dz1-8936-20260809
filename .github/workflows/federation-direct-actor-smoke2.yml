name: Testagram Direct Actor Smoke 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/federation-direct-actor-smoke2.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Provision actor, verify public ActivityPub JSON, and cleanly undo remote follow
        env:
          SUPABASE_URL: https://aepbqfrmheihfsauzcby.supabase.co
          GATEWAY_URL: https://aepbqfrmheihfsauzcby.supabase.co/functions/v1/gateway-relay
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          RUN="${GITHUB_RUN_ID}-${RANDOM}"; EMAIL="fedi-actor2-${RUN}@example.invalid"; PASS="TgActor2-${RUN}-X9!"; USER_ID=""
          trap 'test -z "$USER_ID" || curl -sS -o /dev/null -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$USER_ID" -H "apikey: $SUPABASE_SECRET_KEY" || true' EXIT
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/auth/v1/admin/users" -H "apikey: $SUPABASE_SECRET_KEY" -H 'Content-Type: application/json' -d "$(jq -nc --arg e "$EMAIL" --arg p "$PASS" '{email:$e,password:$p,email_confirm:true}')" >/tmp/user.json
          USER_ID="$(jq -r '.id' /tmp/user.json)"
          TOKEN="$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' -d "$(jq -nc --arg e "$EMAIL" --arg p "$PASS" '{email:$e,password:$p}')" | jq -r '.access_token')"
          STATUS="$(curl -sS -o /tmp/follow.json -w '%{http_code}' --max-time 60 -X POST "$GATEWAY_URL" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"path":"/follow","body":{"target":"@Mastodon@mastodon.social"}}')"
          test "$STATUS" = 200 || { cat /tmp/follow.json; exit 1; }
          ACTOR="$(curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/federation_actors?user_id=eq.$USER_ID&select=actor_url" -H "apikey: $SUPABASE_SECRET_KEY" | jq -r '.[0].actor_url')"
          test -n "$ACTOR" && test "$ACTOR" != "null"
          curl -sS --fail-with-body -H 'Accept: application/activity+json' "$ACTOR" >/tmp/actor.json
          jq -e --arg key "${ACTOR}#main-key" --arg actor "$ACTOR" '.id == $actor and .publicKey.id == $key and .publicKey.owner == .id and (.publicKey.publicKeyPem|length > 100) and .inbox == ($actor + "/inbox")' /tmp/actor.json
          UNFOLLOW_STATUS="$(curl -sS -o /tmp/unfollow.json -w '%{http_code}' --max-time 60 -X POST "$GATEWAY_URL" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"path":"/unfollow","body":{"target":"@Mastodon@mastodon.social"}}')"
          test "$UNFOLLOW_STATUS" = 200 || { cat /tmp/unfollow.json; exit 1; }
