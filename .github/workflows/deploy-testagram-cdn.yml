name: Virtual CDN Verification (no hosted edge deployment)

on:
  push:
    branches: [main]
    paths:
      - "services/testagram-cdn/**"
      - "src/services/virtualCdnLoader.ts"
      - ".github/workflows/deploy-testagram-cdn.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/testagram-cdn/**"
      - "src/services/virtualCdnLoader.ts"
      - ".github/workflows/deploy-testagram-cdn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/testagram-cdn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/testagram-cdn/go.mod
      - name: Test legacy Go edge code (not deployed)
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build legacy Go edge code
        run: go build ./cmd/...
      - name: Verify no hosted edge deployment is configured
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'runs-on: \[self-hosted' .github/workflows/deploy-testagram-cdn.yml; then
            echo "Self-hosted CDN deployment must stay disabled for the zero-cost virtual CDN." >&2
            exit 1
          fi
