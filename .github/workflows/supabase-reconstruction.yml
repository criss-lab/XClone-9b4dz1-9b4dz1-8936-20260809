name: Reconstruct Supabase Backend

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Fresh Supabase project ref to reconstruct"
        required: true
        default: ffrhglgkukgsuhxenena
        type: string
      deploy_functions:
        description: "Deploy repository Edge Functions after migrations"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    name: Rebuild backend from repository source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ inputs.project_ref }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify repository lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "Trendyzima/XClone-9b4dz1-9b4dz1-8936-20260809tr"
          test "${GITHUB_REF_NAME}" = "main"
          test -d supabase/migrations
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration chain locally
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          supabase db reset
          supabase migration list

      - name: Link fresh remote project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DB_PASSWORD}"
          test -n "${SUPABASE_PROJECT_ID}"
          supabase link --project-ref "${SUPABASE_PROJECT_ID}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Preview remote migration plan
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run

      - name: Apply repository migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push

      - name: Deploy repository Edge Functions
        if: ${{ inputs.deploy_functions }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/functions ]; then
            supabase functions deploy --project-ref "${SUPABASE_PROJECT_ID}"
          else
            echo "No repository Edge Functions directory; skipping."
          fi

      - name: Verify remote migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list

      - name: Emit reconstruction receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "BACKEND_RECONSTRUCTION=COMPLETE"
          echo "SUPABASE_PROJECT_ID=${SUPABASE_PROJECT_ID}"
          echo "SOURCE_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "SOURCE_SHA=${GITHUB_SHA}"
          echo "MIGRATIONS_SOURCE=supabase/migrations"
          echo "FUNCTIONS_SOURCE=supabase/functions"
