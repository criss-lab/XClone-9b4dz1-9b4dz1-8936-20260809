name: Testagram New Production Signing Identity Gate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/signing-identity-forensics.yml'

permissions:
  contents: read

env:
  EXPECTED_ALIAS: testagram-production
  EXPECTED_CERT_SHA256: "74:06:19:A9:4F:93:10:33:51:44:4D:C5:83:27:AE:CB:8D:80:2D:2E:8A:8B:32:61:4B:84:D9:32:E7:20:93:7C"
  EXPECTED_SUBJECT: "CN=Testagram Production, OU=Android, O=Testagram, L=Nairobi, ST=Nairobi, C=KE"
  EXPECTED_KEY_SIZE: "4096"

jobs:
  verify-new-production-identity:
    name: Verify NEW Testagram production signing identity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Decode release keystore
        env:
          TESTAGRAM_RELEASE_KEYSTORE_BASE64: ${{ secrets.TESTAGRAM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${TESTAGRAM_RELEASE_KEYSTORE_BASE64}" || { echo "::error::MISSING_SECRET — TESTAGRAM_RELEASE_KEYSTORE_BASE64 is not configured"; exit 1; }
          python3 - <<'PY'
          import base64, os, pathlib, re
          raw = os.environ["TESTAGRAM_RELEASE_KEYSTORE_BASE64"]
          normalized = re.sub(r"\s+", "", raw)
          if not normalized or re.fullmatch(r"[A-Za-z0-9+/]*={0,2}", normalized) is None:
              raise SystemExit("::error::INVALID_BASE64 — secret is not valid Base64")
          if len(normalized) % 4 == 1:
              raise SystemExit(f"::error::INVALID_BASE64 — impossible Base64 length: {len(normalized)}")
          try:
              decoded = base64.b64decode(normalized, validate=True)
          except Exception as exc:
              raise SystemExit(f"::error::INVALID_BASE64 — {exc}")
          pathlib.Path("testagram-production.jks").write_bytes(decoded)
          print(f"Base64 character count: {len(normalized)}")
          print(f"Decoded keystore bytes: {len(decoded)}")
          print("Base64 integrity: PASS")
          PY
          test -s testagram-production.jks

      - name: Verify JKS and production key entry
        env:
          TESTAGRAM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEYSTORE_PASSWORD }}
          TESTAGRAM_RELEASE_KEY_ALIAS: ${{ secrets.TESTAGRAM_RELEASE_KEY_ALIAS }}
          TESTAGRAM_RELEASE_KEY_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" || { echo "::error::MISSING_SECRET — TESTAGRAM_RELEASE_KEYSTORE_PASSWORD"; exit 2; }
          test -n "${TESTAGRAM_RELEASE_KEY_ALIAS}" || { echo "::error::MISSING_SECRET — TESTAGRAM_RELEASE_KEY_ALIAS"; exit 3; }
          test -n "${TESTAGRAM_RELEASE_KEY_PASSWORD}" || { echo "::error::MISSING_SECRET — TESTAGRAM_RELEASE_KEY_PASSWORD"; exit 4; }
          if [ "${TESTAGRAM_RELEASE_KEY_ALIAS}" != "${EXPECTED_ALIAS}" ]; then echo "::error::ALIAS_MISMATCH — expected testagram-production"; exit 5; fi
          if ! keytool -list -keystore testagram-production.jks -storepass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" -storetype JKS >/dev/null 2>&1; then echo "::error::KEYSTORE_PASSWORD_MISMATCH — supplied password cannot open the new JKS"; exit 6; fi
          if ! keytool -list -v -keystore testagram-production.jks -storepass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" -storetype JKS -alias "${EXPECTED_ALIAS}" -keypass "${TESTAGRAM_RELEASE_KEY_PASSWORD}" > certificate.txt 2>/dev/null; then echo "::error::KEY_ENTRY_PASSWORD_MISMATCH — alias/private-key password is inconsistent"; exit 7; fi
          grep -Fq "Keystore type: JKS" certificate.txt || { echo "::error::KEYSTORE_TYPE_MISMATCH — expected JKS"; exit 8; }
          echo "JKS: PASS"
          echo "Alias: ${EXPECTED_ALIAS}"
          echo "Key entry/password: PASS"

      - name: Verify new certificate identity
        run: |
          set -euo pipefail
          CERT_SHA256="$(awk -F': ' '/SHA256:/{print $2; exit}' certificate.txt | tr -d '[:space:]')"
          SUBJECT="$(awk -F': ' '/^Owner: /{sub(/^Owner: /,""); print; exit}' certificate.txt)"
          KEY_SIZE="$(awk '/^Public key: RSA /{match($0,/RSA ([0-9]+) bits/,a); print a[1]; exit}' certificate.txt)"
          test -n "${CERT_SHA256}" || { echo "::error::CERTIFICATE_FINGERPRINT_MISSING"; exit 9; }
          echo "Certificate SHA-256: ${CERT_SHA256}"
          echo "Certificate subject: ${SUBJECT}"
          echo "RSA key size: ${KEY_SIZE} bits"
          normalize() { printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]'; }
          if [ "$(normalize "${CERT_SHA256}")" != "$(normalize "${EXPECTED_CERT_SHA256}")" ]; then echo "::error::CERTIFICATE_MISMATCH — this is not the new Testagram production certificate"; exit 10; fi
          if [ "${KEY_SIZE}" != "${EXPECTED_KEY_SIZE}" ]; then echo "::error::KEY_SIZE_MISMATCH — expected RSA 4096"; exit 11; fi
          if ! grep -Fq "Owner: ${EXPECTED_SUBJECT}" certificate.txt; then echo "::error::SUBJECT_MISMATCH — certificate subject is not the new Testagram Production identity"; exit 12; fi
          echo "NEW PRODUCTION CERTIFICATE: PASS"
          echo "RSA 4096: PASS"
          echo "Subject: PASS"
          echo "Fingerprint: PASS"

      - name: Final verdict
        run: |
          set -euo pipefail
          echo "OLD APK COMPARISON: DISABLED"
          echo "OLD CERTIFICATE COMPARISON: DISABLED"
          echo "OLD KEYSTORE COMPARISON: DISABLED"
          echo "NEW PRODUCTION SIGNING IDENTITY: VERIFIED"

      - name: Cleanup signing material
        if: always()
        run: rm -f testagram-production.jks certificate.txt
