name: Native Federation Backend

on:
  push:
    branches: [main, native-federation-backend-wired]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: federation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web federation validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository currently has no lockfile. Do not enable setup-node's
      # npm cache until a lockfile is deliberately committed; cache: npm
      # otherwise fails before npm install can run.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          test -f .env.example
          test -f package.json
          test -f src/api/federation.ts
          grep -q "application/activity+json" src/api/federation.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web application
        run: npm run build

  android:
    name: Android Kotlin validation
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Kotlin source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/xclone/app/MainActivity.kt
          test ! -f app/src/main/java/com/xclone/app/MainActivity.java

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
