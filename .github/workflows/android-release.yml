name: Testagram Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.2.0)"
        required: true
        default: "v0.2.0"
  push:
    branches:
      - "release/*"

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish the production WebView Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build and verify web application
        run: npm run build

      - name: Sync Android launcher icon from website favicon
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Image.open("public/favicon.ico").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              out_dir = Path("android/app/src/main/res") / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  icon.save(out_dir / name, format="PNG", optimize=True)
          PY

      - name: Configure Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Using configured production release keystore."
            echo "ephemeral=false" >> "${GITHUB_OUTPUT}"
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/testagram-release.jks
            test -s android/testagram-release.jks
            cat > android/keystore.properties <<EOF
          storeFile=testagram-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          else
            echo "::warning::Production Android signing secrets are not configured; generating an ephemeral CI signing key so the build/verification gate can complete."
            echo "ephemeral=true" >> "${GITHUB_OUTPUT}"
            CI_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkeypair -v               -keystore android/testagram-ci.jks               -storepass "${CI_PASSWORD}"               -keypass "${CI_PASSWORD}"               -alias testagram-ci               -keyalg RSA               -keysize 3072               -validity 3650               -dname "CN=Testagram CI,O=Testagram,C=KE"
            cat > android/keystore.properties <<EOF
          storeFile=testagram-ci.jks
          storePassword=${CI_PASSWORD}
          keyAlias=testagram-ci
          keyPassword=${CI_PASSWORD}
          EOF
          fi

      - name: Build signed Android APK and App Bundle
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify release artifacts
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "${APK}"
          test -s "${AAB}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"
          "${APKSIGNER}" verify --verbose "${APK}"
          echo "SHA-256:"
          sha256sum "${APK}" "${AAB}"
          echo "Artifacts:"
          ls -lh "${APK}" "${AAB}"

      - name: Upload verified Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testagram-android-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Remove signing material
        if: always()
        run: rm -f android/testagram-release.jks android/testagram-ci.jks android/keystore.properties

      - name: Publish GitHub Release
        if: steps.signing.outputs.ephemeral != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Testagram Android ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

