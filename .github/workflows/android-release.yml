name: Testagram Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.2.0)"
        required: true
        default: "v0.2.0"
  push:
    branches:
      - "release/*"

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish the production WebView Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build and verify web application
        run: npm run build

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "::error::ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "::error::ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/testagram-release.jks
          test -s android/testagram-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=testagram-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build signed Android APK and App Bundle
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify release artifacts
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "${APK}"
          test -s "${AAB}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"
          "${APKSIGNER}" verify --verbose "${APK}"
          echo "SHA-256:"
          sha256sum "${APK}" "${AAB}"
          echo "Artifacts:"
          ls -lh "${APK}" "${AAB}"

      - name: Remove signing material
        if: always()
        run: rm -f android/testagram-release.jks android/keystore.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Testagram Android ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
