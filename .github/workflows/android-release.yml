name: Testagram Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example release/v0.2.1)"
        required: true
        default: "release/v0.2.1"
  push:
    branches:
      - "release/*"

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish the production WebView Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build and verify web application
        run: npm run build

      - name: Sync Android launcher icon from website favicon
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Image.open("public/favicon.ico").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              out_dir = Path("android/app/src/main/res") / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  icon.save(out_dir / name, format="PNG", optimize=True)
          PY

      - name: Configure Android release signing
        env:
          TESTAGRAM_RELEASE_KEYSTORE_BASE64: ${{ secrets.TESTAGRAM_RELEASE_KEYSTORE_BASE64 }}
          TESTAGRAM_RELEASE_KEY_ALIAS: ${{ secrets.TESTAGRAM_RELEASE_KEY_ALIAS }}
          TESTAGRAM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEYSTORE_PASSWORD }}
          TESTAGRAM_RELEASE_KEY_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TESTAGRAM_RELEASE_KEYSTORE_BASE64}" || { echo "::error::TESTAGRAM_RELEASE_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "${TESTAGRAM_RELEASE_KEY_ALIAS}" || { echo "::error::TESTAGRAM_RELEASE_KEY_ALIAS is not configured"; exit 1; }
          test -n "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" || { echo "::error::TESTAGRAM_RELEASE_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "${TESTAGRAM_RELEASE_KEY_PASSWORD}" || { echo "::error::TESTAGRAM_RELEASE_KEY_PASSWORD is not configured"; exit 1; }
          echo "${TESTAGRAM_RELEASE_KEYSTORE_BASE64}" | base64 --decode > android/testagram-release.jks
          test -s android/testagram-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=testagram-release.jks
          storePassword=${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}
          keyAlias=${TESTAGRAM_RELEASE_KEY_ALIAS}
          keyPassword=${TESTAGRAM_RELEASE_KEY_PASSWORD}
          EOF

      - name: Verify Android signing secret consistency (before Gradle)
        env:
          TESTAGRAM_RELEASE_KEYSTORE_BASE64: ${{ secrets.TESTAGRAM_RELEASE_KEYSTORE_BASE64 }}
          TESTAGRAM_RELEASE_KEY_ALIAS: ${{ secrets.TESTAGRAM_RELEASE_KEY_ALIAS }}
          TESTAGRAM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEYSTORE_PASSWORD }}
          TESTAGRAM_RELEASE_KEY_PASSWORD: ${{ secrets.TESTAGRAM_RELEASE_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail

          KEYSTORE="testagram-release.jks"
          VERIFY_STORE="/tmp/testagram-signing-verification.p12"

          test -s "${KEYSTORE}" || { echo "::error::Signing-secret consistency error: decoded keystore is missing or empty"; exit 1; }

          echo "Checking that keytool can open the decoded keystore..."
          keytool -list -keystore "${KEYSTORE}" -storepass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" >/dev/null \
            || { echo "::error::Signing-secret consistency error: TESTAGRAM_RELEASE_KEYSTORE_PASSWORD does not open the decoded keystore"; exit 1; }

          echo "Checking that the configured alias exists..."
          keytool -list -keystore "${KEYSTORE}" -storepass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" \
            -alias "${TESTAGRAM_RELEASE_KEY_ALIAS}" >/dev/null \
            || { echo "::error::Signing-secret consistency error: TESTAGRAM_RELEASE_KEY_ALIAS does not exist in the decoded keystore"; exit 1; }

          echo "Checking that the configured alias contains a private key and that TESTAGRAM_RELEASE_KEY_PASSWORD matches it..."
          rm -f "${VERIFY_STORE}"
          keytool -importkeystore \
            -srckeystore "${KEYSTORE}" \
            -srcstorepass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" \
            -srcalias "${TESTAGRAM_RELEASE_KEY_ALIAS}" \
            -srckeypass "${TESTAGRAM_RELEASE_KEY_PASSWORD}" \
            -destkeystore "${VERIFY_STORE}" \
            -deststoretype PKCS12 \
            -deststorepass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" \
            -destkeypass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" \
            -noprompt >/dev/null \
            || { echo "::error::Signing-secret consistency error: TESTAGRAM_RELEASE_KEY_PASSWORD does not unlock the configured private key (or the alias is not a private-key entry)"; exit 1; }

          keytool -list -v -keystore "${KEYSTORE}" -storepass "${TESTAGRAM_RELEASE_KEYSTORE_PASSWORD}" \
            -alias "${TESTAGRAM_RELEASE_KEY_ALIAS}" | grep -q 'Entry type: PrivateKeyEntry' \
            || { echo "::error::Signing-secret consistency error: configured alias is not a PrivateKeyEntry"; exit 1; }

          rm -f "${VERIFY_STORE}"
          echo "Signing-secret consistency check passed: keystore opens, alias exists, and private-key password is valid."

      - name: Build signed Android APK and App Bundle
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify release artifacts
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "${APK}"
          test -s "${AAB}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"
          "${APKSIGNER}" verify --verbose "${APK}"
          echo "SHA-256:"
          sha256sum "${APK}" "${AAB}"
          echo "Artifacts:"
          ls -lh "${APK}" "${AAB}"

      - name: Forensic signing identity gate — compare against known-good production APK
        working-directory: android
        env:
          KNOWN_GOOD_SIGNING_CERT_SHA256: 740619a94f93103351444dc58327aecb8d802d2e8a8b32614b84d932e720937c
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          CERT="$( "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' )"
          if [ -z "$CERT" ]; then
            echo "::error::CERTIFICATE_UNAVAILABLE — could not extract APK signing certificate SHA-256."
            exit 4
          fi
          EXPECTED="$(printf '%s' "$KNOWN_GOOD_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          ACTUAL="$(printf '%s' "$CERT" | tr -d ':')"
          echo "Known-good production signing certificate: $EXPECTED"
          echo "Current release APK signing certificate:  $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::MISMATCH — release APK is signed by a different certificate than the known-good production APK."
            exit 5
          fi
          echo "MATCH — release APK uses the known-good production signing identity."

      - name: Upload verified Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testagram-android-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Remove signing material
        if: always()
        run: rm -f android/testagram-release.jks android/testagram-ci.jks android/keystore.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Testagram Android ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

