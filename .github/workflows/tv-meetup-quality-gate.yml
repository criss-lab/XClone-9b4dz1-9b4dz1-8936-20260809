name: TV MeetUp Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "src/components/features/TvMeetupPanel.tsx"
      - "src/pages/TvPublicLivePage.tsx"
      - "src/pages/TvStudioPage.tsx"
      - "supabase/migrations/*tv_meetup*.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tv-meetup-quality-gate.yml"
  workflow_dispatch:

concurrency:
  group: tv-meetup-quality-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing SHA: $(git rev-parse HEAD)"

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify TV MeetUp migration contract
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260930110000_tv_meetup_interaction.sql"
          hardening="supabase/migrations/20260930194500_tv_meetup_poll_security_hardening.sql"
          test -f "$migration"
          test -f "$hardening"
          grep -q "tv_live_polls" "$migration"
          grep -q "tv_live_poll_votes" "$migration"
          grep -q "tv_live_poll_results" "$migration"
          grep -q "status = 'open'" "$hardening"
          grep -q "grant execute on function public.tv_live_poll_results(uuid) to authenticated" "$hardening"
          echo "TV MeetUp database contract checks passed."
