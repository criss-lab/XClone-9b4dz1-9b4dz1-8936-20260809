name: Build native media engine image

on:
  push:
    branches: [main]
    paths:
      - "media-engine/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./media-engine
          push: true
          tags: |
            ghcr.io/trendyzima/testagram-media-engine:latest
            ghcr.io/trendyzima/testagram-media-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
