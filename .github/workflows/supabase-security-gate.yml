name: Testagram Supabase Security Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: supabase/setup-cli@v2
        with:
          version: 2.118.0
      - name: Resolve Supabase project
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::Missing/invalid SUPABASE_PROJECT_REF"; exit 1; }
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --skip-pooler
      - name: Run remote PL/pgSQL lint
        run: supabase db lint --linked --level warning --fail-on error
      - name: Verify security boundary migration is present
        run: test -f supabase/migrations/20261002210000_security_observability_dr_hardening_v1.sql