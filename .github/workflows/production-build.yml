name: Production Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Data-plane safety gate
        run: node scripts/verify-data-plane.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
