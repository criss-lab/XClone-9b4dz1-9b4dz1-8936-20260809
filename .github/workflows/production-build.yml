name: Production Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Dependency install attempt ${attempt}/3"
            if npm ci --no-audit --no-fund > /tmp/npm-ci-attempt.log 2>&1; then
              cat /tmp/npm-ci-attempt.log
              exit 0
            else
              status=$?
            fi
            cat /tmp/npm-ci-attempt.log
            if [ "${attempt}" -lt 3 ] && grep -Eqi 'statusCode: 50[234]|HTTP[^[:cntrl:]]*50[234]|ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENETUNREACH|socket hang up|network timeout' /tmp/npm-ci-attempt.log; then
              delay=$((attempt * 15))
              echo "Transient upstream/network failure detected (exit ${status}); retrying in ${delay}s." >&2
              sleep "${delay}"
              continue
            fi
            echo "Dependency installation failed without a retryable network error (exit ${status}), or all retries were exhausted." >&2
            exit "${status}"
          done
          exit 1

      - name: Data-plane safety gate
        run: node scripts/verify-data-plane.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        # TV playback must not require an unavailable optional CDN at startup.
        # The app's default is origin-first; opt into the CDN only after deployment health is verified.
        run: npm run build

      - name: Test embedded Testagram CDN
        working-directory: services/testagram-edge
        run: |
          go version
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/edge
