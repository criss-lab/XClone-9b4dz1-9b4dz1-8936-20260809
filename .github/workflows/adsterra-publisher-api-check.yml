name: Adsterra Publisher API Credential Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adsterra-publisher-api-check
  cancel-in-progress: false

jobs:
  validate-publisher-api:
    name: Validate Adsterra publisher API access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API token is configured
        shell: bash
        env:
          ADSTERRA_API_TOKEN: ${{ secrets.api_token_1 }}
        run: |
          set -euo pipefail
          if [[ -z "${ADSTERRA_API_TOKEN}" ]]; then
            echo "::error::Repository Actions secret api_token_1 is missing or empty."
            exit 1
          fi
          echo "Adsterra API secret is available to this workflow (value hidden)."

      - name: Request publisher domains endpoint
        shell: bash
        env:
          ADSTERRA_API_TOKEN: ${{ secrets.api_token_1 }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          # Never put the token in the URL, shell trace, or workflow output.
          set +e
          http_code="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "X-API-Key: ${ADSTERRA_API_TOKEN}" \
            --header 'Accept: application/json' \
            'https://api3.adsterratools.com/publisher/domains.json')"
          curl_exit=$?
          set -e

          if [[ "$curl_exit" -ne 0 ]]; then
            echo "::error::Could not reach the Adsterra Publisher API (curl exit $curl_exit). Response body suppressed."
            exit 1
          fi

          if [[ "$http_code" != "200" ]]; then
            case "$http_code" in
              401) echo "::error::Adsterra rejected the token (HTTP 401). Check api_token_1 in GitHub Actions Secrets." ;;
              403) echo "::error::Adsterra denied access (HTTP 403). The token may be expired or lack publisher access." ;;
              404) echo "::error::Adsterra publisher domains endpoint returned HTTP 404." ;;
              *) echo "::error::Adsterra Publisher API returned HTTP $http_code. Response body suppressed." ;;
            esac
            exit 1
          fi

          if ! jq -e . "$response_file" >/dev/null 2>&1; then
            echo "::error::Adsterra returned HTTP 200 but the response was not valid JSON. Body suppressed."
            exit 1
          fi

          echo "PASS: Adsterra Publisher API returned HTTP 200 and valid JSON."
          echo "Response content and API token were not printed."
