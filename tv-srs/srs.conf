listen 1935;
max_connections 10000;
daemon off;
srs_log_tank console;

http_api {
  enabled on;
  listen 1985;
}

rtc_server {
  enabled on;
  listen 8000;
  candidate *;
  tcp {
    enabled on;
    listen 8000;
  }
}

vhost __defaultVhost__ {
  rtc {
    enabled on;
    rtc_to_rtmp on;
    rtmp_to_rtc off;
    nack on;
    twcc on;
  }

  http_hooks {
    enabled on;
    on_publish https://testagram.site/api/live?srs=auth;
    on_unpublish https://testagram.site/api/live?srs=auth;
  }

  forward {
    enabled on;
    backend https://testagram.site/api/live?srs=forward;
  }
}
