name: testagram
description: Testagram shared Flutter web and Android client.
publish_to: none
version: 0.3.0+5
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  supabase_flutter: ^2.9.1
  cached_network_image: ^3.4.1
  video_player: ^2.9.5
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  http: ^1.4.0
  http_parser: ^4.1.2
  web: ^1.1.1
  youtube_player_iframe: ^5.2.1
  cryptography: ^2.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/testagram-icon.webp

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: ../public/tsocial-logo.png
    background_color: "#050605"
    theme_color: "#148F44"
  image_path: ../public/tsocial-logo.png
  adaptive_icon_background: "#050605"
  adaptive_icon_foreground: ../public/tsocial-logo.png
